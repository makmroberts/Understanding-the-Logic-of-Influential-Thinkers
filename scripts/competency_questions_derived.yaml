# Competency questions, DERIVED from the corpus.
#
# A question is SHAPE x INTENT and both halves come from the data:
#
#   shape   which facet slots it binds. Taken from the author's own 20
#           opening questions - every map's L0 node - which reduce to exactly
#           3 shapes. The hand-written set used 6, three of which he never
#           asks.
#   intent  which Toulmin family the answer is drawn from, i.e. the role axis
#           (scripts/schema_map.yaml role_families).
#
# A pair is admitted only if some binding returns >=3 claims across >=2
# articles, so a question that cannot be answered never enters the set. On
# this corpus 16 of 24 pairs qualify.
#
# WHAT IS AUTHORED HERE, AND IT IS ONLY THIS: the natural-language phrasing
# per intent ("What does he assume about ..."). The slots, the role buckets,
# the admission decision and the support counts are all measured.
#
# WHY THIS REPLACES A HAND-WRITTEN SET. The old file governs facets.yaml - a
# term is admitted only when some question needs it - but the questions were
# themselves written while reading the corpus, which made the governance
# claim circular. Deriving them from the author's own questions breaks that:
# the questions are his, the vocabulary answers to them.
#
# TO RUN THIS FOR ANOTHER THINKER: annotate their corpus, then re-run the
# derivation. Nothing here is specific to this author except the measured
# numbers.

version: 2
derived_from: the 20 L0 question nodes in mermaid_code/*.mmd
governs: scripts/facets.yaml

# Two intents are declared by the role axis and have NO support in this
# corpus, so no question is emitted for them. Recorded because their absence
# is a finding about the corpus, not an oversight:
#   backing   4 claims corpus-wide (source_credibility, benchmark)
#   revision  3 claims corpus-wide (revised_prior) - so "where has he changed
#             his mind" is aspirational at any useful threshold, though the
#             old CQ8 claimed to answer it
unsupported_intents: [backing, revision]

shapes:
  instrument+variable+where:
    attested_in_articles: 11   # of 20
  variable+where:
    attested_in_articles: 6   # of 20
  data_basis+variable+where:
    attested_in_articles: 3   # of 20

rules:
  # carried over verbatim from version 1: these are design rules about
  # retrieval, not questions, and the derivation does not touch them.

  one_hop_expansion:
    rule: >
      After facet filtering, re-admit nodes within one hop of the filtered set
      along `supports`, `licenses`, `bounds` and `reconstructs` edges, even when
      their own facets do not match.
    why: >
      A warrant usually does not mention the topic - that is WHY it is
      unstated. setser_feb_26_20#P1 ("Trade balance = saving - investment") is
      a hidden assumption carrying no tariff vocabulary at all, yet it is the
      node that makes the tariff argument work. Pure intersection filtering
      drops exactly the 12 hidden_assumption nodes that are the most valuable
      thing in the corpus. Non-negotiable.

  concept_dedup:
    rule: >
      Collapse results to the concept layer (scripts/concepts.yaml) before
      emitting. Return one entry per concept, with every instance attached as a
      citation, newest first.
    why: >
      This, not filtering, is what makes cost flat as the corpus grows. The
      number of distinct priors a thinker holds saturates while articles
      accumulate linearly: 43 stated_assumption nodes across 20 articles are
      perhaps 15 distinct priors. Filtering buys a constant factor; concept
      dedup buys the asymptote. Currently 9 of 358 nodes carry a concept, so
      this rule is mostly inert - that is the gap to close next.

  role_buckets_preserved:
    rule: >
      Facet filtering narrows the candidate set; it does not change how results
      are grouped or weighted. Keep the existing LEVELS table in ask.py.
    why: >
      The role axis is the finished part of this project. The subject axis is a
      pre-filter in front of it, not a replacement for it.

  empty_is_an_answer:
    rule: >
      When a facet combination matches nothing, say so. Do not widen the query
      and present the result as if it answered the question.
    why: >
      ask.py already has a coverage check guarding exactly this. A topic filter
      makes the failure mode worse, not better: a narrow query that silently
      falls back to the whole corpus looks authoritative and is wrong.

  provenance_required:
    rule: Every returned line keeps its `doc#node_id` and date.
    why: Non-negotiable property of the existing system; retrieval, not prediction.

questions:
  - id: DQ1
    question: Where does he land on how {instrument} affects {variable} in {where}?
    shape: [instrument, variable, where]
    intent: claim
    facets: [instrument, variable, where]
    role_types: [intermediate_claim, main_claim, policy_reductio, recommendation, reconstruction]
    retrieval: >
      instrument = {instrument} AND variable = {variable} AND where = {where}, then role_types, then one_hop_expansion, then concept_dedup
    support:
      bindings_over_threshold: 9
      claims_reachable: 21
      articles_spanned: 11
      shape_attested_in: 11   # of his 20 questions
    widest_binding: {instrument: purchase-commitments, variable: import-volumes, where: china}
  - id: DQ2
    question: What question does he pose about how {instrument} affects {variable} in {where}?
    shape: [instrument, variable, where]
    intent: framing
    facets: [instrument, variable, where]
    role_types: [deferred_question, position_map, question]
    retrieval: >
      instrument = {instrument} AND variable = {variable} AND where = {where}, then role_types, then one_hop_expansion, then concept_dedup
    support:
      bindings_over_threshold: 6
      claims_reachable: 8
      articles_spanned: 7
      shape_attested_in: 11   # of his 20 questions
    widest_binding: {instrument: purchase-commitments, variable: bilateral-trade-flows, where: china}
  - id: DQ3
    question: What evidence has he cited on how {instrument} affects {variable} in {where}?
    shape: [instrument, variable, where]
    intent: grounds
    facets: [instrument, variable, where]
    role_types: [evidence_data, evidence_discrepancy, evidence_rival, evidence_source]
    retrieval: >
      instrument = {instrument} AND variable = {variable} AND where = {where}, then role_types, then one_hop_expansion, then concept_dedup
    support:
      bindings_over_threshold: 5
      claims_reachable: 11
      articles_spanned: 7
      shape_attested_in: 11   # of his 20 questions
    widest_binding: {instrument: tariffs, variable: import-volumes, where: us}
  - id: DQ4
    question: What would he concede about how {instrument} affects {variable} in {where}?
    shape: [instrument, variable, where]
    intent: qualifier
    facets: [instrument, variable, where]
    role_types: [caveat, scope_choice]
    retrieval: >
      instrument = {instrument} AND variable = {variable} AND where = {where}, then role_types, then one_hop_expansion, then concept_dedup
    support:
