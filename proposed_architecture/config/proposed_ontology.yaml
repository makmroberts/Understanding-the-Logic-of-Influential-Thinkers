extraction_rules:
  role_selection: Assign only roles declared in roles; zero or more instances of any role.
  edge_selection: Create edges only when the article supports an identifiable argumentative relation;
    do not generate edges solely from proximity or layout.
  unknown_role: Flag for review; do not silently create new role.
  unknown_relation: Flag for review; do not silently create new relation.
  node_granularity: Prefer individually attributable propositions on first pass.
  evidence_boundary: Represent what the author asserts or reports, not independently established economic
    truth; preserve hedges and source attribution.
  implicit_premises: Infer hidden assumptions conservatively and flag them for human review; do not
    require a literal source sentence for an unstated premise.
  paragraph_attribution: Each extracted role should have a specific paragrph ID attribution.
  specificity: Choose the most specific fitting role; do not choose a generic fallback merely because
    it is available.
  ambiguity: When role distinctions remain genuinely ambiguous, return the closest defensible role and
    flag for review in the later validation stage.
  no_template: Do not require a fixed number of nodes per role, a prescribed order, or a connected flowchart.
legacy_migration_note: Header/class/level parsing rules, Mermaid layout operators and arrow defaults
  remain in schema_map.yaml for migrating older maps; not part of new direct-text extraction ontology.
