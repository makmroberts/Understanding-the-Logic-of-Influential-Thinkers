ccount diverge from the customs surplus, and which is right?\"]\n    ANOM[\"<b>Anomaly<\/b><br/><i>n/a<\/i>\"]\n    POS[\"<b>Position map<\/b><br/><i>n/a<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Stated assumption<\/b><br/>The balance-of-payments surplus should exceed customs; a methodology change should net out\"]\n    P2[\"<b>Hidden assumption<\/b><br/>Customs data is ground truth — never argued for, the whole case rests on it\"]\n    P3[\"<b>Revised prior<\/b><br/><i>absent — no self-correction in this piece<\/i>\"]\n    ID[\"<b>Accounting identity<\/b><br/><i>n/a<\/i>\"]\n    SC[\"<b>Source credibility<\/b><br/>The methodology was already changed at a convenient moment in 2015, and backdated\"]\n  end\n\n  subgraph L1B[\"Level 1b · Frame & scope\"]\n    BM[\"<b>Benchmark<\/b><br/><i>n/a<\/i>\"]\n    SCP[\"<b>Scope choice<\/b><br/><i>absent — he adopts the IMF's own framing<\/i>\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"<b>Data<\/b><br/>Reported current account ~$150bn below expectation in Q2\"]\n    E2[\"<b>Studies & sources<\/b><br/>IMF Article IV Appendix VII; consistent with Adam Wolf's work\"]\n    E3[\"<b>Rival measurement<\/b><br/>The customs goods series against the balance-of-payments goods series\"]\n    E4[\"<b>Discrepancy<\/b><br/>Gap explodes from 2022; BoP imports exceed customs imports for the first time in 2023\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Mechanism A<\/b> · <i>kind: DISTORTION<\/i><br/>#quot;Factoryless#quot; manufacturing — a sale to a non-resident is booked as an export though the goods never leave China\"]\n    M2[\"<b>Mechanism B<\/b> · <i>kind: DISTORTION<\/i><br/>Compilers switched from customs data to direct enterprise reporting in 2022\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Intermediate claim<\/b><br/>It makes no economic sense; the offsetting adjustment is absent; the series cannot be replicated\"]\n    C2[\"<b>Case type<\/b><br/><i>n/a<\/i>\"]\n    C3[\"<b>Policy reductio<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim<\/b> · <i>type: single<\/i><br/>The reported surplus is an artifact of a methodology change\"]\n    RC[\"<b>Reconstruction<\/b><br/>Goods surplus understated by ~$300bn, over 1.5pp of GDP; true current account surplus close to $700bn — use the customs data\"]\n    REC[\"<b>Recommendation<\/b><br/><i>implied only — stop using the reported series<\/i>\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"<b>Opposing view<\/b><br/>Analysts and the IMF read the post-2021 decline as real\"]\n    QF[\"<b>Caveat<\/b><br/>The income line carries no detail, so this cannot be checked from outside\"]\n    R1[\"<b>Other explanation<\/b><br/><i>absent — he allows no rival reading<\/i>\"]\n    DF[\"<b>Deferred question<\/b><br/>The interest income anomaly is set aside #quot;for a future blog#quot;\"]\n  end\n\n  E3 -->|supports| E4\n  SC -->|supports| E4\n  E2 -->|supports| M1\n  E2 -->|supports| M2\n  M1 -->|supports| C1\n  M2 -->|supports| C1\n  E4 -->|supports| C1\n  E1 -->|supports| C1\n  P1 -->|licenses| C1\n  C1 -->|supports| K\n  K -->|reconstructs| RC\n  P2 -->|licenses| RC\n  K -->|motivates| REC\n  K -.->|rebuts| X\n  RC -.->|qualified by| QF\n  K -.->|defers| DF\n\n  T ~~~ L0\n  L0 ~~~ L1\n  L1 ~~~ L1B\n  L1B ~~~ L2\n  L2 ~~~ L3\n  L3 ~~~ L4\n  L4 ~~~ L5\n  L5 ~~~ L6\n\n\n  subgraph LEG[\"How to read this\"]\n    G1[\"<b>Filled<\/b><br/>the article does this\"]\n    G2[\"<b>Implicit<\/b><br/>present, but never stated outright\"]\n    G3[\"<b>Empty<\/b><br/><i>n/a<\/i> = category error here<br/><i>absent<\/i> = could have, did not\"]\n  end\n\n  classDef title fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8,stroke-width:2px\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef cred fill:#5A2E7A,stroke:#CFA8EC,color:#F3E4FB,stroke-width:2px\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef distort fill:#7A4310,stroke:#EBA869,color:#FBEFE6,stroke-width:2px\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef main fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:3px\n  classDef recon fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:2px,stroke-dasharray:6 3\n  classDef dia fill:#444441,stroke:#B4B2A9,color:#F1EFE8\n  classDef question fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8\n  classDef implicit fill:#2A2A45,stroke:#7A79A8,color:#C9C8E4\n  classDef legdemo fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef ghost fill:#1C1C1B,stroke:#4A4945,color:#6B6A65,stroke-dasharray:4 4\n\n  class T title\n  class Q question\n  class P1 prior\n  class P2 unstated\n  class SC cred\n  class E1,E2,E3,E4 data\n  class M1,M2 distort\n  class C1 mech\n  class K main\n  class RC recon\n  class X,QF,DF dia\n  class ANOM,POS,P3,ID,BM,SCP,C2,C3,R1 ghost\n  class G1 legdemo\n  class G2 implicit\n  class G3 ghost\n  class REC implicit\n"}, {"file": "setser_may_5_25.mmd", "stem": "setser_may_5_25", "group": "Argument maps", "title": "Why Didn't Tariffs Push Up the U.S. Dollar?", "shape": "Shape E · parallel enumeration", "subtitle": "", "question": "Why didn't tariffs push up the dollar?", "date": "5 May 2025", "iso": "2025-05-05", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L1B", "L2", "L3", "L4", "L5", "L6"], "nodes": 30, "lines": 131, "code": "---\nconfig:\n  layout: elk\n  theme: dark\n  themeVariables:\n    lineColor: \"#D3D1C7\"\n    clusterBkg: \"#262624\"\n    clusterBorder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 180\n    nodeSpacing: 22\n    rankSpacing: 40\n---\nflowchart TD\n\n  T[\"<b>May 2025 · #quot;Why Didn't Tariffs Push Up the U.S. Dollar?#quot;<\/b><br/><b>Shape E · parallel enumeration<\/b><br/>The only article that starts from a failed forecast and the only one that refuses to land on a single cause.<br/><br/>16 of 26 slots filled\"]\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Question<\/b><br/>Why didn't tariffs push up the dollar?\"]\n    ANOM[\"<b>Anomaly<\/b><br/>Treasury, the CEA, conventional analysts and markets all expected appreciation. The dollar fell about 10% against the G10.\"]\n    POS[\"<b>Position map<\/b><br/>Bessent at roughly 4% appreciation per 10% of tariffs; Miran expecting a rise; Lerner symmetry in the textbooks; going long the dollar as the standard post-election trade\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Stated assumption<\/b><br/>Lerner symmetry holds — a tax on imports is a tax on exports, even without retaliation\"]\n    P2[\"<b>Hidden assumption<\/b><br/>Tariffs leave capital flows untouched, demand for U.S. assets is constant, and trading partners will not change their own policies\"]\n    P3[\"<b>Revised prior<\/b><br/>#quot;the dollar's downturn was still a bit of a surprise#quot; — he counts himself among those caught out\"]\n    ID[\"<b>Accounting identity<\/b><br/><i>n/a<\/i>\"]\n    SC[\"<b>Source credibility<\/b><br/><i>n/a<\/i>\"]\n  end\n\n  subgraph L1B[\"Level 1b · Frame & scope\"]\n    BM[\"<b>Benchmark<\/b><br/><i>n/a<\/i>\"]\n    SCP[\"<b>Scope choice<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"<b>Data<\/b><br/>Dollar down ~10% against the G10; a $400-550 imported phone now carries $40-110 of tariff; CNY 7.2, KRW 1400, JPY 140; 55% of China's formal reserves still in dollars\"]\n    E2[\"<b>Studies & sources<\/b><br/>The Miran paper; IMF working paper on Lerner symmetry; SAFE 2023 annual report; Aitken on the ageing exceptionalism trade\"]\n    E3[\"<b>Rival measurement<\/b><br/><i>n/a<\/i>\"]\n    E4[\"<b>Discrepancy<\/b><br/><i>n/a<\/i>\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Mechanism A<\/b> · <i>kind: economic<\/i><br/>Five channels at once — tariffs as fiscal tightening, recession risk hitting equities, China declining to let the yuan slide, Europe's fiscal turn, and a risk premium from treating allies as adversaries\"]\n    M2[\"<b>Mechanism B<\/b> · <i>kind: economic<\/i><br/>The dollar was priced for perfection: the flow equilibrium needed ever-larger inflows at ever-higher valuations\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Intermediate claim<\/b><br/>Each of the five channels is plausible and none is decisive on its own\"]\n    C2[\"<b>Case type<\/b><br/><i>absent<\/i>\"]\n    C3[\"<b>Policy reductio<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim<\/b> · <i>type: unresolved<\/i><br/>#quot;In a sense, the dollar's recent weakness is over-determined#quot; — he declines to choose\"]\n    RC[\"<b>Reconstruction<\/b><br/><i>n/a<\/i>\"]\n    REC[\"<b>Recommendation<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"<b>Opposing view<\/b><br/>The consensus he started from — that tariffs mechanically lift the dollar\"]\n    QF[\"<b>Caveat<\/b><br/>The dollar is still strong by most measures; claims about the end of its reign are exaggerated\"]\n    R1[\"<b>Other explanation<\/b><br/>The five theories function as rivals to each other, and he keeps all of them live\"]\n    DF[\"<b>Deferred question<\/b><br/>The Taiwan test — how much appreciation will its central bank tolerate, and how would Treasury respond to one-sided intervention? #quot;This story isn't over.#quot;\"]\n  end\n\n  POS -->|supports| ANOM\n  ANOM -->|motivates| Q\n  P3 -.->|revises| P1\n  E1 -->|supports| M1\n  E2 -->|supports| M1\n  E1 -->|supports| M2\n  P2 -.->|undercut by| M1\n  M1 -->|supports| C1\n  M2 -->|supports| C1\n  C1 -->|supports| K\n  K -.->|rebuts| X\n  K -.->|qualified by| QF\n  C1 -.->|undercut by| R1\n  K -.->|defers| DF\n\n  T ~~~ L0\n  L0 ~~~ L1\n  L1 ~~~ L1B\n  L1B ~~~ L2\n  L2 ~~~ L3\n  L3 ~~~ L4\n  L4 ~~~ L5\n  L5 ~~~ L6\n\n\n  subgraph LEG[\"How to read this\"]\n    G1[\"<b>Filled<\/b><br/>the article does this\"]\n    G2[\"<b>Implicit<\/b><br/>present, but never stated outright\"]\n    G3[\"<b>Empty<\/b><br/><i>n/a<\/i> = category error here<br/><i>absent<\/i> = could have, did not\"]\n  end\n\n  classDef title fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8,stroke-width:2px\n  classDef anom fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8,stroke-width:3px\n  classDef pos fill:#2E3A5A,stroke:#9FB3DC,color:#E9ECF5,stroke-width:2px\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef revised fill:#7A2B4D,stroke:#F0A8C4,color:#FBE4EE,stroke-width:2px\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef main fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:3px,stroke-dasharray:6 3\n  classDef dia fill:#444441,stroke:#B4B2A9,color:#F1EFE8\n  classDef question fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8\n  classDef implicit fill:#2A2A45,stroke:#7A79A8,color:#C9C8E4\n  classDef legdemo fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef ghost fill:#1C1C1B,stroke:#4A4945,color:#6B6A65,stroke-dasharray:4 4\n\n  class T title\n  class Q question\n  class ANOM anom\n  class POS pos\n  class P1 prior\n  class P2 unstated\n  class P3 revised\n  class E1,E2 data\n  class M1,M2 mech\n  class C1 mech\n  class K main\n  class X,QF,R1,DF dia\n  class ID,SC,BM,SCP,E3,E4,C2,C3,RC,REC ghost\n  class G1 legdemo\n  class G2 implicit\n  class G3 ghost\n"}, {"file": "setser_2025-07-07_china-stealth-surplus.mmd", "stem": "setser_2025-07-07_china-stealth-surplus", "group": "Argument maps", "title": "China's Stealth Trade Surplus", "shape": "", "subtitle": "", "question": "Why does China's surplus look small in IMF imbalance data when trade flows show it is huge?", "date": "7 Jul 2025", "iso": "2025-07-07", "author": "Brad W. Setser", "outlet": "CFR Follow the Money", "url": "https://www.cfr.org/articles/chinas-stealth-trade-surplus", "topics": "China, EU, balance of payments, statistics, IMF", "genre": "blog / data critique", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 13, "lines": 100, "code": "---\nconfig:\n  layout: elk\n  theme: dark\n  themeVariables:\n    lineColor: \"#D3D1C7\"\n    clusterBkg: \"#262624\"\n    clusterBorder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n  %% author: Brad W. Setser | outlet: CFR Follow the Money | date: 2025-07-07\n  %% title: China's Stealth Trade Surplus\n  %% url: https://www.cfr.org/articles/chinas-stealth-trade-surplus\n  %% topics: China, EU, balance of payments, statistics, IMF | genre: blog / data critique\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"`**Question**\n      Why does China's surplus look small in IMF imbalance data when trade flows show it is huge?`\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"`**Stated assumption**\n      A large real estate crisis typically pushes a country to rely more on exports (standard economic theory)`\"]\n    P2[\"`**Stated assumption**\n      Customs goods data captures China's real imbalance better than balance of payments data`\"]\n    P3[\"`**Hidden assumption**\n      *Opaque official statistics that no one can replicate deserve less trust than physical trade flows*`\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"`**Data**\n      China's 2024 current account surplus about $430 billion (just over 2 percent of GDP) versus the EU's $500 billion; goods and services surplus about $650 billion versus the EU's $620 billion; about $4 trillion in net interest-paying foreign assets, yet an investment income deficit of $150 to 200 billion; Chinese customs data show about $400 per phone; net vehicle exports above 6 million`\"]\n    E2[\"`**Studies and sources**\n      IMF 2024 Article IV report; China's State Administration of Foreign Exchange argument about Apple; European Central Bank (Philip Lane) analysis of Ireland; Kenneth Rogoff in the IMF's Finance and Development`\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"`**China understated**\n      An unexplained 2021 break in China's balance of payments goods series and an unexplained investment income deficit shrink China's reported current account`\"]\n    M2[\"`**EU overstated**\n      U.S. multinationals in Ireland (Apple, pharmaceutical companies) inflate the EU's goods surplus and hide its investment income surplus`\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"`**Intermediate claim**\n      Current account comparisons based on balance of payments data make Europe, not China, look like the main source of imbalance`\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"`**Main claim**\n      The real imbalance is in China; the IMF and G7 should focus there`\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"`**Opposing view**\n      The IMF and analysts using comprehensive goods and services data, who see the EU as the biggest contributor`\"]\n    QF[\"`**Caveat**\n      Balance of payments adjustments may or may not be more accurate, and some are legitimate (insurance and freight, Airbus)`\"]\n    R1[\"`**Other explanation**\n      China's services deficit, mostly travel, genuinely reduces its surplus`\"]\n  end\n\n  P1 --> C1\n  P2 --> M1\n  P2 --> M2\n  E1 --> M1\n  E2 --> M1\n  E2 --> M2\n  M1 --> C1\n  M2 --> C1\n  P3 -->|rule behind it| C1\n  C1 --> K\n  K -.->|pushes back on| X\n  K -. caveat .- QF\n  M1 -. other explanation .- R1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ E1\n  P3 ~~~ E2\n\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef main fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:3px\n  classDef dia fill:#444441,stroke:#B4B2A9,color:#F1EFE8\n  classDef question fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8\n  class P1,P2 prior\n  class P3 unstated\n  class E1,E2 data\n  class M1,M2,C1 mech\n  class K main\n  class X,QF,R1 dia\n  class Q question\n"}, {"file": "setser_2025-07-28_china-eu-trade-war.mmd", "stem": "setser_2025-07-28_china-eu-trade-war", "group": "Argument maps", "title": "China is also Fighting a Trade War with Europe (and Winning)", "shape": "", "subtitle": "", "question": "Why is Europe losing ground to China in trade, and what should it do about it?", "date": "28 Jul 2025", "iso": "2025-07-28", "author": "Brad W. Setser", "outlet": "CFR Follow the Money", "url": "https://www.cfr.org/articles/china-also-fighting-trade-war-europe-and-winning", "topics": "China, EU, industrial policy, currency, autos", "genre": "blog / policy commentary", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 13, "lines": 100, "code": "---\nconfig:\n  layout: elk\n  theme: dark\n  themeVariables:\n    lineColor: \"#D3D1C7\"\n    clusterBkg: \"#262624\"\n    clusterBorder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n  %% author: Brad W. Setser | outlet: CFR Follow the Money | date: 2025-07-28\n  %% title: China is also Fighting a Trade War with Europe (and Winning)\n  %% url: https://www.cfr.org/articles/china-also-fighting-trade-war-europe-and-winning\n  %% topics: China, EU, industrial policy, currency, autos | genre: blog / policy commentary\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"`**Question**\n      Why is Europe losing ground to China in trade, and what should it do about it?`\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"`**Stated assumption**\n      China's trade war tools are industrial policy and a weak currency, not tariffs`\"]\n    P2[\"`**Stated assumption**\n      Chinese firms, private or state-linked, accept low returns on equity and build too much`\"]\n    P3[\"`**Hidden assumption**\n      *A trading partner's surplus drains demand from your economy; manufacturing capacity has strategic value beyond its profits*`\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"`**Data**\n      European exports to China down about 0.5 percentage points of European GDP; EU trade deficit with China set to double between 2020 and 2025; European auto exports to China on track for about $10 billion by 2027; Chinese electric vehicle exports at a 3 million annual pace in the second quarter; net exports added about 2 percentage points to Chinese growth over four quarters; yuan weaker against the euro`\"]\n    E2[\"`**Studies and sources**\n      Centre for European Reform brief on German industry; Financial Times, New York Times and Wall Street Journal sector reporting; Adam Tooze; German customs data`\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"`**Overcapacity**\n      Competing local governments add subsidized capacity, which drives profits down and pushes output China cannot absorb into exports`\"]\n    M2[\"`**Weak currency**\n      State banks keep the yuan weak; its fall against the euro has roughly offset the EU's 17 percent countervailing duty on BYD`\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"`**Intermediate claim**\n      The second China shock is eroding Europe's core export sectors and is large enough to matter for the whole economy, especially Germany's stagnation`\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"`**Main claim**\n      China is winning a trade war with Europe; Europe needs a counter-industrial policy, broader tariffs on Chinese autos and new pressure for the yuan to rise`\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"`**Opposing view**\n      Europe's inadequate response so far; Trump-style tariffs or commodity purchase deals as the fix`\"]\n    QF[\"`**Caveat**\n      The United States is still importing, which limits the damage, but American firms will not absorb tariff costs much longer`\"]\n    R1[\"`**Other explanation**\n      China's long-standing tariff walls (25 percent on autos) also helped build the sector`\"]\n  end\n\n  P1 --> M1\n  P2 --> M1\n  P1 --> M2\n  E1 --> M1\n  E1 --> M2\n  E2 --> M1\n  M1 --> C1\n  M2 --> C1\n  P3 -->|rule behind it| C1\n  C1 --> K\n  K -.->|pushes back on| X\n  K -. caveat .- QF\n  M1 -. other explanation .- R1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ E1\n  P3 ~~~ E2\n\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef main fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:3px\n  classDef dia fill:#444441,stroke:#B4B2A9,color:#F1EFE8\n  classDef question fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8\n  class P1,P2 prior\n  class P3 unstated\n  class E1,E2 data\n  class M1,M2,C1 mech\n  class K main\n  class X,QF,R1 dia\n  class Q question\n"}, {"file": "setser_2025-09-12_trump-shock-that-wasnt.mmd", "stem": "setser_2025-09-12_trump-shock-that-wasnt", "group": "Argument maps", "title": "The Trump Shock That Wasn't (At Least Not Yet)", "shape": "", "subtitle": "", "question": "Have Trump's tariffs actually shocked trade flows and the global economy?", "date": "12 Sep 2025", "iso": "2025-09-12", "author": "Brad W. Setser", "outlet": "CFR Follow the Money", "url": "https://www.cfr.org/articles/trump-shock-wasnt-least-not-yet", "topics": "US tariffs, trade flows, elasticities, WTO", "genre": "blog / data analysis", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 15, "lines": 107, "code": "---\nconfig:\n  layout: elk\n  theme: dark\n  themeVariables:\n    lineColor: \"#D3D1C7\"\n    clusterBkg: \"#262624\"\n    clusterBorder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n  %% author: Brad W. Setser | outlet: CFR Follow the Money | date: 2025-09-12\n  %% title: The Trump Shock That Wasn't (At Least Not Yet)\n  %% url: https://www.cfr.org/articles/trump-shock-wasnt-least-not-yet\n  %% topics: US tariffs, trade flows, elasticities, WTO | genre: blog / data analysis\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"`**Question**\n      Have Trump's tariffs actually shocked trade flows and the global economy?`\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"`**Stated assumption**\n      A global tariff works like an exchange rate move: import elasticity of about 0.3 to 0.4, not the bilateral elasticity of about 2`\"]\n    P2[\"`**Stated assumption**\n      Record tariff revenue means Americans keep importing and paying the tariff`\"]\n    P3[\"`**Hidden assumption**\n      *Tax- and finance-driven flows (pharmaceuticals, gold) are noise; core trade is the real signal*`\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"`**Data**\n      Annualized trade deficit peaked at $2 trillion in March, fell to $1 trillion, then rebounded to $1.2 trillion in July; imports from Taiwan up over 50 percent year to date; first-term tariffs cut affected trade about 30 percent, and about 50 percent for goods tariffed at 25 percent; high-frequency global trade measures have not slowed`\"]\n    E2[\"`**Studies and sources**\n      New York Times reporting; U.S. trade data; federal court ruling on tariff authority`\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"`**Front-running**\n      Pharmaceutical stockpiling (distorted by tax) and gold flows drive the headline swings`\"]\n    M2[\"`**Trade diversion**\n      Imports shift from China to Taiwan and Southeast Asia as final assembly relocates`\"]\n    M3[\"`**Artificial intelligence investment**\n      The data center buildout pushes electronics imports up`\"]\n    M4[\"`**Elasticity math**\n      A 15 percent tariff times a 0.3 to 0.4 elasticity cuts imports 5 to 6 percent; non-oil imports fall from about 10 to 9.5 percent of GDP`\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"`**Intermediate claim**\n      Excluding pharmaceuticals and gold, U.S. imports are roughly on trend; the shock to trade rules far exceeds the shock to trade flows`\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"`**Main claim**\n      The Trump shock to trade flows has not happened yet, though a modest impact should appear`\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"`**Opposing view**\n      Reading headline volatility as tariffs crushing trade`\"]\n    QF[\"`**Caveat**\n      August deals doubled tariffs on Southeast Asia relative to April; fall data may show more impact; the tariffs' legality is unresolved`\"]\n    R1[\"`**Other explanation**\n      Waiting for tariff relief (autos) replaces front-running; other exporters can take U.S. market share abroad`\"]\n  end\n\n  P3 --> M1\n  E1 --> M1\n  E1 --> M2\n  E1 --> M3\n  P1 --> M4\n  E2 --> M1\n  M1 --> C1\n  M2 --> C1\n  M3 --> C1\n  P2 --> C1\n  M4 --> K\n  P3 -->|rule behind it| C1\n  C1 --> K\n  K -.->|pushes back on| X\n  K -. caveat .- QF\n  M1 -. other explanation .- R1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ E1\n  P3 ~~~ E2\n\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef main fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:3px\n  classDef dia fill:#444441,stroke:#B4B2A9,color:#F1EFE8\n  classDef question fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8\n  class P1,P2 prior\n  class P3 unstated\n  class E1,E2 data\n  class M1,M2,M3,M4,C1 mech\n  class K main\n  class X,QF,R1 dia\n  class Q question\n"}, {"file": "setser_2025-11-12_china-surplus-imf.mmd", "stem": "setser_2025-11-12_china-surplus-imf", "group": "Argument maps", "title": "China's Massive Surplus is Everywhere (Yet The IMF Still Has Trouble Seeing It Clearly)", "shape": "", "subtitle": "", "question": "How big is China's surplus really, why does the IMF miss it, and what policy should follow?", "date": "12 Nov 2025", "iso": "2025-11-12", "author": "Brad W. Setser", "outlet": "CFR Follow the Money", "url": "https://www.cfr.org/articles/chinas-massive-surplus-everywhere-yet-imf-still-has-trouble-seeing-it-clearly", "topics": "China, IMF, global imbalances, fiscal policy", "genre": "blog / institutional critique", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 14, "lines": 103, "code": "---\nconfig:\n  layout: elk\n  theme: dark\n  themeVariables:\n    lineColor: \"#D3D1C7\"\n    clusterBkg: \"#262624\"\n    clusterBorder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n  %% author: Brad W. Setser | outlet: CFR Follow the Money | date: 2025-11-12\n  %% title: China's Massive Surplus is Everywhere (Yet The IMF Still Has Trouble Seeing It Clearly)\n  %% url: https://www.cfr.org/articles/chinas-massive-surplus-everywhere-yet-imf-still-has-trouble-seeing-it-clearly\n  %% topics: China, IMF, global imbalances, fiscal policy | genre: blog / institutional critique\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"`**Question**\n      How big is China's surplus really, why does the IMF miss it, and what policy should follow?`\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"`**Stated assumption**\n      The surplus stems from a shortfall in China's domestic demand (European Central Bank view)`\"]\n    P2[\"`**Stated assumption**\n      Deflation combined with a rising trade surplus calls for sustained fiscal expansion, not monetary easing`\"]\n    P3[\"`**Hidden assumption**\n      *External balance is a legitimate policy target; exporting your way out of a slump imposes costs on other countries*`\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"`**Data**\n      Export volumes up 40 percent since end-2019 versus imports up 1 percent; manufactured goods surplus over $2 trillion (about 10.5 percent of GDP); goods surplus $1.2 trillion; car exports over 6 million, heading toward 8 million in 2026; current account surplus 2.2 percent of GDP versus the EU's 2.6 percent; IMF forecast a 2025 surplus of $375 billion, while the actual tops $650 billion through the third quarter`\"]\n    E2[\"`**Studies and sources**\n      IMF External Sector Report 2025, October World Economic Outlook and 2024 Article IV report; European Central Bank analysis; Netherlands Bureau for Economic Policy Analysis export volume data; Microsoft annual report`\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"`**Demand shortfall**\n      Weak domestic demand leaves spare capacity for exports; rate cuts lower yields and weaken the yuan, widening the surplus`\"]\n    M2[\"`**Mismeasurement**\n      The 2022 balance of payments methodology and the unexplained income deficit each cut about 1 percentage point of GDP from the reported current account surplus`\"]\n    M3[\"`**IMF lens**\n      Relying only on the reported current account frames China's problem as purely internal, so the IMF prescribes monetary easing`\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"`**Intermediate claim**\n      China's surplus is massive and growing, yet IMF policy advice effectively lets China export its way out of its housing slump`\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"`**Main claim**\n      The IMF should recognize China's external imbalance and call for a fiscal expansion funded by the central government`\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"`**Opposing view**\n      The IMF's framing; the argument that Europe's surplus is almost as big`\"]\n    QF[\"`**Caveat**\n      China's GDP data are too thin to confirm the net export math; the IMF does support pro-consumption structural reforms`\"]\n    R1[\"`**Other explanation**\n      Ireland distorts European data; IMF forecast misses come from ignoring lagged exchange rate effects and treating the pandemic surge as temporary`\"]\n  end\n\n  P1 --> M1\n  E1 --> M1\n  E1 --> M2\n  E2 --> M2\n  E2 --> M3\n  M2 --> M3\n  M1 --> C1\n  M3 --> C1\n  P2 --> K\n  P3 -->|rule behind it| C1\n  C1 --> K\n  K -.->|pushes back on| X\n  K -. caveat .- QF\n  M3 -. other explanation .- R1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ E1\n  P3 ~~~ E2\n\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef main fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:3px\n  classDef dia fill:#444441,stroke:#B4B2A9,color:#F1EFE8\n  classDef question fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8\n  class P1,P2 prior\n  class P3 unstated\n  class E1,E2 data\n  class M1,M2,M3,C1 mech\n  class K main\n  class X,QF,R1 dia\n  class Q question\n"}, {"file": "setser_2026-02-03_october-2025-deficit.mmd", "stem": "setser_2026-02-03_october-2025-deficit", "group": "Argument maps", "title": "Understanding the Low October 2025 Trade Deficit", "shape": "", "subtitle": "", "question": "Does the low October 2025 trade deficit mean the tariffs are working?", "date": "3 Feb 2026", "iso": "2026-02-03", "author": "Brad W. Setser", "outlet": "CFR Expert Take", "url": "https://www.cfr.org/articles/understanding-the-low-october-2025-trade-deficit", "topics": "US trade deficit, tariffs, stockpiling, fiscal policy", "genre": "Q&A explainer", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 15, "lines": 106, "code": "---\nconfig:\n  layout: elk\n  theme: dark\n  themeVariables:\n    lineColor: \"#D3D1C7\"\n    clusterBkg: \"#262624\"\n    clusterBorder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n  %% author: Brad W. Setser | outlet: CFR Expert Take | date: 2026-02-03\n  %% title: Understanding the Low October 2025 Trade Deficit\n  %% url: https://www.cfr.org/articles/understanding-the-low-october-2025-trade-deficit\n  %% topics: US trade deficit, tariffs, stockpiling, fiscal policy | genre: Q&A explainer\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"`**Question**\n      Does the low October 2025 trade deficit mean the tariffs are working?`\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"`**Stated assumption**\n      Tariffs reduce the trade deficit only if their proceeds reduce the budget deficit, acting as a tax hike`\"]\n    P2[\"`**Stated assumption**\n      Remove pharmaceuticals and gold to read the underlying deficit`\"]\n    P3[\"`**Hidden assumption**\n      *The trade balance is a macroeconomic savings-investment outcome; inventory swings reverse over time*`\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"`**Data**\n      October's drop came entirely from pharmaceuticals and gold; excluding them, October's deficit was slightly bigger than September's; August to October deficits below 2024, but early 2025 far above; imports of autos and household durable goods down; imports of semiconductors and computers up`\"]\n    E2[\"`**Studies and sources**\n      U.S. trade data; Section 232 semiconductor investigation`\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"`**Tariff fears**\n      Fear of tariffs that never came drove pharmaceutical stockpiling and gold flowing out and back`\"]\n    M2[\"`**Inventory drawdown**\n      Stockpiles built ahead of tariffs temporarily depress imports, and stockpiles run out`\"]\n    M3[\"`**Untariffed artificial intelligence investment**\n      The data center buildout keeps semiconductor and computer imports rising`\"]\n    M4[\"`**Fiscal channel**\n      Promised refund checks and pressure for more defense spending block a fiscal adjustment`\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"`**Intermediate claim**\n      Tariffs reduce imports in specific categories, but the overall deficit is driven by untariffed goods and stockpile timing`\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"`**Main claim**\n      No: the low October deficit is not evidence the tariffs work, and a significant fall in the 2025 deficit is unlikely`\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"`**Opposing view**\n      Trump's trade team claiming success from smaller deficits than in the same months of 2024`\"]\n    QF[\"`**Caveat**\n      Tariffed categories really are falling; watch whether imports rebound once stockpiles are exhausted`\"]\n    R1[\"`**Other explanation**\n      Auto imports fell along with auto sales: weaker demand rather than more U.S. production`\"]\n  end\n\n  P2 --> M1\n  E1 --> M1\n  E1 --> M2\n  E1 --> M3\n  E2 --> M3\n  P1 --> M4\n  M1 --> C1\n  M2 --> C1\n  M3 --> C1\n  M4 --> K\n  P3 -->|rule behind it| C1\n  C1 --> K\n  K -.->|pushes back on| X\n  K -. caveat .- QF\n  M2 -. other explanation .- R1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ E1\n  P3 ~~~ E2\n\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef data fill:#0C447C,stroke:#85B7EB,color:# <script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@12.1.0/dist/mermaid.esm.min.mjs';
import elkLayouts from 'https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@1.0.1/dist/mermaid-layout-elk.esm.min.mjs';

const MAPS = JSON.parse(document.getElementById('data').textContent);
const byFile = new Map(MAPS.map(m => [m.file, m]));

mermaid.registerLayoutLoaders(elkLayouts);
mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',                 // older maps have no frontmatter theme; this keeps them dark
  securityLevel: 'loose',        // local, trusted files; keeps <b>/<br/> labels intact
  maxTextSize: 500000,
  maxEdges: 2000,
  fontFamily: '-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif',
  flowchart: { htmlLabels: true, useMaxWidth: false },
});

/* ---------------------------------------------------------- rendering --- */
const svgCache = new Map();
let seq = 0;

async function renderMap(file) {
  if (svgCache.has(file)) return svgCache.get(file);
  const p = (async () => {
    const { svg } = await mermaid.render('m' + (seq++), byFile.get(file).code);
    return svg;
  })();
  svgCache.set(file, p);
  p.catch(() => svgCache.delete(file));
  return p;
}

window.argumentMaps = { maps: MAPS, render: renderMap };

/* -------------------------------------------------------------- panes --- */
class Pane {
  constructor(index) {
    this.index = index;
    this.file = null;
    this.k = 1; this.x = 0; this.y = 0;

    const el = document.createElement('div');
    el.className = 'pane';
    el.innerHTML = `
      <div class="phead">
        <select></select>
        <button class="btn src-btn" title="Show the .mmd source">source</button>
      </div>
      <div class="meta"></div>
      <div class="stage">
        <div class="canvas"></div>
        <div class="status">Pick a map from the left.</div>
        <div class="zoom">
          <button data-z="out" title="Zoom out">−</button>
          <span class="pct">100%</span>
          <button data-z="in" title="Zoom in">+</button>
          <button data-z="fit" title="Fit to window (0)">⤢</button>
        </div>
      </div>
      <pre class="src"></pre>`;
    this.el = el;
    this.sel = el.querySelector('select');
    this.metaEl = el.querySelector('.meta');
    this.stage = el.querySelector('.stage');
    this.canvas = el.querySelector('.canvas');
    this.statusEl = el.querySelector('.status');
    this.pctEl = el.querySelector('.pct');
    this.srcEl = el.querySelector('.src');

    for (const m of MAPS) {
      const o = document.createElement('option');
      o.value = m.file;
      o.textContent = (m.date ? m.date + ' — ' : '') + m.title;
      this.sel.append(o);
    }
    this.sel.onchange = () => this.load(this.sel.value);
    el.querySelector('.src-btn').onclick = (e) => {
      el.classList.toggle('showsrc');
      e.currentTarget.classList.toggle('on', el.classList.contains('showsrc'));
    };
    el.addEventListener('mousedown', () => setActive(this.index), true);
    el.querySelector('.zoom').onclick = (e) => {
      const z = e.target.dataset.z;
      if (z === 'in') this.zoomBy(1.25);
      else if (z === 'out') this.zoomBy(1 / 1.25);
      else if (z === 'fit') this.fit();
    };
    this.wirePanZoom();
  }

  async load(file) {
    if (!file) return;
    this.file = file;
    this.sel.value = file;
    const m = byFile.get(file);
    this.srcEl.textContent = m.code;
    this.renderMeta(m);
    this.canvas.innerHTML = '';
    this.statusEl.style.display = '';
    this.statusEl.className = 'status';
    this.statusEl.textContent = 'Laying out…';
    paintList();

    try {
      const svg = await renderMap(file);
      if (this.file !== file) return;                 // user moved on
      this.canvas.innerHTML = svg;
      const el = this.canvas.querySelector('svg');
      const vb = (el.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
      if (vb.length === 4) {
        el.style.width = vb[2] + 'px';
        el.style.height = vb[3] + 'px';
      }
      el.removeAttribute('width'); el.removeAttribute('height');
      this.statusEl.style.display = 'none';
      this.fit();
    } catch (err) {
      this.canvas.innerHTML = '';
      this.statusEl.style.display = '';
      this.statusEl.className = 'status err';
      this.statusEl.textContent = 'Mermaid could not render ' + file + '\n\n' + (err && err.message || err);
    }
  }

  renderMeta(m) {
    const bits = [`<b>${esc(m.title)}</b>`];
    const line = [m.date, m.outlet, m.genre, m.shape].filter(Boolean).map(esc);
    if (line.length) bits.push(`<span>${line.join(' · ')}</span>`);
    bits.push(`<span>${esc(m.file)}</span>`);
    if (m.levels.length) bits.push(`<span>${m.levels.join(' ')}</span>`);
    if (m.url) bits.push(`<a href="${esc(m.url)}" target="_blank" rel="noreferrer">article ↗</a>`);
    if (m.topics) bits.push(`<span>${esc(m.topics)}</span>`);
    if (m.question && !m.question.startsWith(m.title.slice(0, 40)))
      bits.push(`<span class="q">${esc(m.question)}</span>`);
    this.metaEl.innerHTML = bits.join('');
  }

  /* ---- zoom / pan ---- */
  apply() {
    this.canvas.style.transform = `translate(${this.x}px,${this.y}px) scale(${this.k})`;
    this.pctEl.textContent = Math.round(this.k * 100) + '%';
  }
  svgSize() {
    const el = this.canvas.querySelector('svg');
    if (!el) return null;
    return { w: parseFloat(el.style.width) || el.clientWidth, h: parseFloat(el.style.height) || el.clientHeight };
  }
  fit() {
    const s = this.svgSize(); if (!s) return;
    const r = this.stage.getBoundingClientRect();
    this.k = Math.min((r.width - 32) / s.w, (r.height - 32) / s.h);
    this.k = Math.max(0.05, Math.min(this.k, 2));
    this.x = (r.width - s.w * this.k) / 2;
    this.y = (r.height - s.h * this.k) / 2;
    this.apply();
  }
  zoomAt(factor, cx, cy) {
    const k2 = Math.max(0.05, Math.min(8, this.k * factor));
    const f = k2 / this.k;
    this.x = cx - (cx - this.x) * f;
    this.y = cy - (cy - this.y) * f;
    this.k = k2;
    this.apply();
  }
  zoomBy(factor) {
    const r = this.stage.getBoundingClientRect();
    this.zoomAt(factor, r.width / 2, r.height / 2);
  }
  wirePanZoom() {
    this.stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const r = this.stage.getBoundingClientRect();
      this.zoomAt(Math.pow(0.9988, e.deltaY), e.clientX - r.left, e.clientY - r.top);
    }, { passive: false });

    let sx = 0, sy = 0, ox = 0, oy = 0, down = false;
    this.stage.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      down = true; sx = e.clientX; sy = e.clientY; ox = this.x; oy = this.y;
      this.stage.classList.add('drag');
      this.stage.setPointerCapture(e.pointerId);
    });
    this.stage.addEventListener('pointermove', (e) => {
      if (!down) return;
      this.x = ox + (e.clientX - sx); this.y = oy + (e.clientY - sy); this.apply();
    });
    const up = () => { down = false; this.stage.classList.remove('drag'); };
    this.stage.addEventListener('pointerup', up);
    this.stage.addEventListener('pointercancel', up);
    this.stage.addEventListener('dblclick', () => this.fit());
  }
}

/* --------------------------------------------------------------- shell --- */
const panesEl = document.getElementById('panes');
const listEl = document.getElementById('list');
const qEl = document.getElementById('q');
const cmpBtn = document.getElementById('cmp');

const panes = [new Pane(0), new Pane(1)];
let split = false, active = 0;

function layout() {
  panesEl.innerHTML = '';
  panesEl.classList.toggle('split', split);
  panesEl.append(panes[0].el);
  if (split) panesEl.append(panes[1].el);
  cmpBtn.classList.toggle('on', split);
  setActive(split ? active : 0);
  requestAnimationFrame(() => panes.forEach(p => { if (p.el.isConnected && p.file) p.fit(); }));
}
function setActive(i) {
  active = split ? i : 0;
  panes.forEach((p, j) => p.el.classList.toggle('active', j === active));
  paintList();
}
function toggleSplit() {
  split = !split;
  layout();
  if (split && !panes[1].file) panes[1].load(panes[0].file || MAPS[0].file);
}
cmpBtn.onclick = toggleSplit;

const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function visible() {
  const q = qEl.value.trim().toLowerCase();
  if (!q) return MAPS;
  return MAPS.filter(m => [m.title, m.file, m.date, m.topics, m.outlet, m.genre, m.shape, m.question]
    .join(' ').toLowerCase().includes(q));
}

function paintList() {
  const open = new Set(panes.filter(p => p.el.isConnected).map(p => p.file));
  listEl.innerHTML = '';
  let group = null;
  for (const m of visible()) {
    if (m.group !== group) {
      group = m.group;
      const h = document.createElement('div');
      h.className = 'grouphead';
      h.textContent = group;
      listEl.append(h);
    }
    const b = document.createElement('button');
    b.className = 'item' + (open.has(m.file) ? ' on' : '');
    const which = split && open.has(m.file)
      ? ' <span class="badge">[' + (panes[0].file === m.file ? 'A' : '') + (panes[1].file === m.file ? 'B' : '') + ']</span>'
      : '';
    b.innerHTML = `<div class="t">${esc(m.title)}${which}</div>
      <div class="m">${[m.date, m.file].filter(Boolean).map(esc).join(' · ')}</div>`;
    b.onclick = () => panes[active].load(m.file);
    listEl.append(b);
  }
}

qEl.oninput = paintList;

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
    if (e.key === 'Escape') { qEl.value = ''; paintList(); qEl.blur(); }
    return;
  }
  const p = panes[active];
  if (e.key === '0') p.fit();
  else if (e.key === '+' || e.key === '=') p.zoomBy(1.25);
  else if (e.key === '-') p.zoomBy(1 / 1.25);
  else if (e.key === 'c') toggleSplit();
  else if (e.key === '/') { e.preventDefault(); qEl.focus(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const list = visible();
    const i = list.findIndex(m => m.file === p.file);
    const next = list[Math.min(list.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)))];
    if (next) p.load(next.file);
  }
});

addEventListener('resize', () => panes.forEach(p => { if (p.el.isConnected && p.file) p.fit(); }));

layout();
paintList();
panes[0].load((MAPS.find(m => m.group !== 'Schema & templates') || MAPS[0]).file);
</script>
</body>
</html>
