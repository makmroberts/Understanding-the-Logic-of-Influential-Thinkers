<style>
  :root{

  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{

  }
  button,select,input{font:inherit;color:inherit}

  .app{display:grid;grid-template-columns:320px 1fr;height:100vh}

  /* ---------------------------------------------------------- sidebar --- */
  .side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side header{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .side h1{margin:0;font-size:14px;letter-spacing:.02em}
  .side .sub{color:var(--ink-faint);font-size:11px;margin-top:3px}
  .search{margin:10px 14px 8px}
  .search input{
    width:100%;padding:7px 9px;background:var(--bg);border:1px solid var(--line);
    border-radius:6px;outline:none
  }
  .search input:focus{border-color:var(--focus)}
  .list{overflow:auto;padding:0 8px 24px;min-height:0;flex:1}
  .grouphead{
    padding:12px 6px 5px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-faint)
  }
  .item{
    width:100%;text-align:left;display:block;background:none;border:1px solid transparent;
    border-radius:7px;padding:8px 9px;margin:1px 0;cursor:pointer
  }
  .item:hover{background:var(--panel-2)}
  .item.on{background:var(--accent-dim);border-color:var(--accent)}
  .item .t{font-weight:600;line-height:1.35}
  .item .m{color:var(--ink-faint);font-size:11px;margin-top:3px;font-variant-numeric:tabular-nums}
  .item.on .m{color:#BFE8D8}
  .item .badge{color:var(--ink-dim);font-size:10px}

  /* ------------------------------------------------------------ panes --- */
  .main{display:flex;flex-direction:column;min-width:0}
  .toolbar{
    display:flex;gap:8px;align-items:center;padding:9px 12px;
    border-bottom:1px solid var(--line);background:var(--panel)
  }
  .toolbar .spacer{flex:1}
  .btn{
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;
    padding:5px 10px;cursor:pointer
  }
  .btn:hover{border-color:var(--ink-faint)}
  .btn.on{background:var(--accent-dim);border-color:var(--accent);color:#DFF3EB}
  .hint{color:var(--ink-faint);font-size:11px}

  .panes{flex:1;display:grid;grid-template-columns:1fr;min-height:0}
  .panes.split{grid-template-columns:1fr 1fr}
  .pane{display:flex;flex-direction:column;min-width:0;border-left:1px solid var(--line)}
  .pane:first-child{border-left:0}
  .panes.split .pane.active .phead{box-shadow:inset 2px 0 0 var(--accent)}
  .phead{
    display:flex;gap:8px;align-items:center;padding:7px 10px;
    border-bottom:1px solid var(--line);background:var(--panel-2)
  }
  .phead select{
    background:var(--bg);border:1px solid var(--line);border-radius:6px;
    padding:4px 6px;max-width:100%;flex:1;min-width:0
  }
  .meta{
    padding:7px 12px;border-bottom:1px solid var(--line);color:var(--ink-dim);
    font-size:11px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline
  }
  .meta b{color:var(--ink);font-size:12px}
  .meta a{color:var(--focus)}
  .meta .q{color:var(--ink-faint);flex-basis:100%}

  .stage{flex:1;overflow:hidden;position:relative;cursor:grab;background:var(--bg)}
  .stage.drag{cursor:grabbing}
  .canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .canvas svg{display:block;max-width:none!important;height:auto}
  .status{
    position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    color:var(--ink-faint);text-align:center;max-width:70%
  }
  .zoom{
    position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:center;
    background:rgba(38,38,36,.92);border:1px solid var(--line);border-radius:7px;padding:4px
  }
  .zoom button{
    background:none;border:0;border-radius:5px;width:26px;height:24px;cursor:pointer;
    color:var(--ink-dim)
  }
  .zoom button:hover{background:var(--panel-2);color:var(--ink)}
  .zoom .pct{color:var(--ink-faint);font-size:11px;min-width:40px;text-align:center;
    font-variant-numeric:tabular-nums}
  .src{
    display:none;flex:1;overflow:auto;margin:0;padding:12px;background:#1F1F1D;
    border-top:1px solid var(--line);font:11.5px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;
    color:var(--ink-dim);white-space:pre
  }
  .pane.showsrc .src{display:block}
  .pane.showsrc .stage{flex:0 0 45%}
  .err{color:#F0A8C4;white-space:pre-wrap;text-align:left;font:12px/1.5 ui-monospace,Consolas,monospace}
</style>

 Priors & assumptions\"]\n    P1[\"<b>Net exports contribute to GDP growth<\/b><br/>Changes in exports and imports mechanically affect output growth\"]\n    P2[\"<b>Trade shapes employment composition<\/b><br/>Goods-producing sectors and regions are unevenly exposed\"]\n    P3[\"<b>Persistent deficits accumulate external debt<\/b><br/>Ongoing borrowing raises the net external debt stock\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>2014–16 net-export drag<\/b><br/>Net exports subtracted about 1.5pp from U.S. growth\"]\n    D2[\"<b>Manufacturing employment varies with trade<\/b><br/>Surplus economies retain larger manufacturing job shares\"]\n    D3[\"<b>Manufacturing balance did not drive adjustment<\/b><br/>Lower oil imports and offshore income reduced the current-account deficit\"]\n    D4[\"<b>External debt rose from ~20% to ~50% of GDP<\/b><br/>Debt increased even as U.S. borrowing costs fell\"]\n    D5[\"<b>Higher rates or wider deficits raise debt ratios<\/b><br/>Either would weaken current favorable debt dynamics\"]\n    D6[\"<b>Tax cuts could widen trade deficit<\/b><br/>Setser estimates roughly 0.3–0.5% of GDP over several years\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Trade deficits can drag on growth<\/b><br/>More demand leaks abroad through net imports\"]\n    M2[\"<b>Trade shifts where jobs are located<\/b><br/>Manufacturing deficits reduce employment in exposed sectors and regions\"]\n    M3[\"<b>Deficits build external debt<\/b><br/>Persistent borrowing plus higher interest costs raise the external debt burden\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Trade changes the pace of growth<\/b><br/>A stronger economy can coexist with a deficit, but net exports still affect realized GDP growth\"]\n    C2[\"<b>Trade changes the composition of employment<\/b><br/>Its effects are sectoral and regional even near full employment\"]\n    C3[\"<b>Current debt stability is conditional<\/b><br/>It depends on favorable growth, rates, and offshore income continuing\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim: the trade balance remains worth watching<\/b><br/>It contains information about growth, employment composition,<br/>and long-run external debt sustainability\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    X[\"<b>Opposing view<\/b><br/>A wider deficit can reflect stronger domestic demand rather than weakness\"]\n    QF1[\"<b>Measurement caveat<\/b><br/>Monthly trade data are noisy and should be read as a time series\"]\n    QF2[\"<b>Employment caveat<\/b><br/>Near full employment, trade changes job distribution more than total employment\"]\n    R1[\"<b>Debt caveat<\/b><br/>The U.S. can sustain more external debt than most because of the dollar's global role\"]\n  end\n\n  P1 --> M1\n  D1 --> M1\n  D6 --> M1\n  M1 --> C1\n\n  P2 --> M2\n  D2 --> M2\n  D3 --> M2\n  M2 --> C2\n\n  P3 --> M3\n  D4 --> M3\n  D5 --> M3\n  M3 --> C3\n\n  C1 --> K\n  C2 --> K\n  C3 --> K\n\n  C1 -.->|qualified by| X\n  K -.->|measurement caveat| QF1\n  C2 -.->|qualified by| QF2\n  C3 -.->|qualified by| R1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D1 & D6\n  P2 ~~~ D2 & D3\n  P3 ~~~ D4 & D5\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color:#04342C\n  classDef main fill:#E1F5EE,stroke:#0F6E56,color:#04342C,stroke-width:3px\n  classDef dia fill:#F1EFE8,stroke:#5F5E5A,color:#2C2C2A\n  classDef question fill:#FFFFFF,stroke:#2C2C2A,color:#2C2C2A\n\n  class P1,P2,P3 prior\n  class D1,D2,D3,D4,D5,D6 data\n  class M1,M2,M3,C1,C2,C3 mech\n  class K main\n  class X,QF1,QF2,R1 dia\n  class Q question\n  linkStyle 15,16,17,18 stroke:#A32D2D,color:#A32D2D"}, {"file": "setser_feb_15_18.mmd", "stem": "setser_feb_15_18", "group": "Argument maps", "title": "Will Trump's fiscal expansion undermine his goal of reducing the U.S. trade deficit?", "shape": "", "subtitle": "", "question": "Will Trump's fiscal expansion undermine his goal of reducing the U.S. trade deficit? Brad Setser, CFR, Feb 2018", "date": "15 Feb 2018", "iso": "2018-02-15", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 20, "lines": 96, "code": "---\nconfig:\n  layout: elk\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Will Trump's fiscal expansion undermine<br/>his goal of reducing the U.S. trade deficit?<\/b><br/><i>Brad Setser, CFR, Feb 2018<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Fiscal stimulus raises domestic demand<\/b><br/>Tax cuts and spending increases boost U.S. demand\"]\n    P2[\"<b>Imports respond strongly to U.S. demand<\/b><br/>Fed model: import income elasticity around 2\"]\n    P3[\"<b>Exchange-rate effects arrive with lags<\/b><br/>Dollar moves take years to fully affect trade\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>Fiscal deficit +1.7–2% of GDP<\/b><br/>Tax cuts and spending increases provide a large fiscal impulse\"]\n    D2[\"<b>IMF external-balance coefficient<\/b><br/>Simple model implies current-account deficit rises about 1% of GDP\"]\n    D3[\"<b>Q4 2017 demand surge leaked into imports<\/b><br/>Over half of the increase in domestic demand was spent abroad\"]\n    D4[\"<b>U.S. external debt ≈ 50% of GDP<\/b><br/>Higher rates mechanically increase payments to foreign creditors\"]\n    D5[\"<b>Foreign currencies strengthening<\/b><br/>Euro and several Asian currencies were moving against the dollar\"]\n    D6[\"<b>Setser's Fed-model calculation<\/b><br/>Fiscal impulse adds roughly 50bp of GDP in imports over two years\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Stimulus raises imports<\/b><br/>Stronger U.S. demand spills into foreign production\"]\n    M2[\"<b>Higher rates raise external interest costs<\/b><br/>More income flows abroad on the U.S. debt stock\"]\n    M3[\"<b>Dollar depreciation improves trade slowly<\/b><br/>Exports rise and imports soften only after substantial lags\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Fiscal expansion widens the real trade deficit<\/b><br/>Import growth accelerates relative to the baseline\"]\n    C2[\"<b>Income channel worsens the current account<\/b><br/>Higher interest payments add to the external deficit\"]\n    C3[\"<b>Favorable adjustment forces arrive too slowly<\/b><br/>Foreign growth and a softer dollar cannot offset the near-term impulse\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim: the tax bill sets back Trump's trade goals<\/b><br/>U.S. fiscal stimulus boosts imports just as conditions<br/>were emerging for the trade deficit to improve\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    X[\"<b>Smaller-spillover argument<\/b><br/>The U.S. is relatively closed and much of the tax cut may be saved\"]\n    QF[\"<b>Model uncertainty<\/b><br/>Historical income elasticities and trade relationships may not hold perfectly\"]\n    R1[\"<b>Offsetting adjustment forces<\/b><br/>Dollar depreciation and stronger foreign demand can improve U.S. trade\"]\n  end\n\n  P1 --> M1\n  P2 --> M1\n  D1 --> M1\n  D3 --> M1\n  D6 --> M1\n  M1 --> C1\n\n  D4 --> M2\n  M2 --> C2\n\n  P3 --> M3\n  D5 --> M3\n  M3 --> C3\n\n  D2 --> C1\n\n  C1 --> K\n  C2 --> K\n  C3 --> K\n\n  C1 -.->|qualified by| X\n  C1 -.->|model caveat| QF\n  C3 -.->|offsetting force| R1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D1 & D2\n  P2 ~~~ D3 & D6\n  P3 ~~~ D4 & D5\n  K ~~~ X\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color:#04342C\n  classDef main fill:#E1F5EE,stroke:#0F6E56,color:#04342C,stroke-width:3px\n  classDef dia fill:#F1EFE8,stroke:#5F5E5A,color:#2C2C2A\n  classDef question fill:#FFFFFF,stroke:#2C2C2A,color:#2C2C2A\n\n  class P1,P2,P3 prior\n  class D1,D2,D3,D4,D5,D6 data\n  class M1,M2,M3,C1,C2,C3 mech\n  class K main\n  class X,QF,R1 dia\n  class Q question\n\n  linkStyle 15,16,17 stroke:#A32D2D,color:#A32D2D"}, {"file": "setser_jun_4_18.mmd", "stem": "setser_jun_4_18", "group": "Argument maps", "title": "Could global macro shocks overwhelm trade deals and push the U.S. trade deficit higher?", "shape": "", "subtitle": "", "question": "Could global macro shocks overwhelm trade deals and push the U.S. trade deficit higher? Brad Setser, CFR, June 2018", "date": "4 Jun 2018", "iso": "2018-06-04", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 20, "lines": 96, "code": "---\nconfig:\n  layout: elk\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Could global macro shocks overwhelm trade deals<br/>and push the U.S. trade deficit higher?<\/b><br/><i>Brad Setser, CFR, June 2018<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Trade balances are macroeconomic<\/b><br/>They reflect demand, fiscal policy, currencies, and external adjustment—not just trade deals\"]\n    P2[\"<b>U.S. fiscal stimulus needs foreign demand<\/b><br/>The deficit rises unless stronger U.S. demand is matched abroad\"]\n    P3[\"<b>Weak demand encourages export-led adjustment<\/b><br/>Countries under pressure often rely on weaker currencies and exports\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>Argentina and Turkey must adjust<\/b><br/>Large external deficits mean weaker domestic demand and less global demand growth\"]\n    D2[\"<b>2014–15 precedent<\/b><br/>EM weakness coincided with slower global trade and a larger U.S. non-oil deficit\"]\n    D3[\"<b>Italy/eurozone risk<\/b><br/>Financial and political stress could weaken the euro\"]\n    D4[\"<b>China is tightening<\/b><br/>Domestic weakness plus dollar strength could create depreciation pressure\"]\n    D5[\"<b>Japan faces fiscal tightening<\/b><br/>Consumption-tax hikes have historically weakened domestic demand\"]\n    D6[\"<b>2017 was unusually favorable<\/b><br/>Europe, China, Japan, and EM demand all supported the global environment\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Foreign adjustment weakens demand<\/b><br/>Lower domestic spending abroad reduces demand for imports\"]\n    M2[\"<b>Weaker foreign currencies strengthen the dollar<\/b><br/>Dollar strength hurts U.S. trade competitiveness\"]\n    M3[\"<b>Demand divergence widens the U.S. deficit<\/b><br/>Strong U.S. demand plus weak foreign demand raises net imports\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>EM adjustment reduces global demand support<\/b><br/>Foreign economies contribute less to import growth\"]\n    C2[\"<b>Euro and Asian weakness could lift the dollar<\/b><br/>Currency shifts reinforce pressure on U.S. trade\"]\n    C3[\"<b>The 2017 macro constellation may be ending<\/b><br/>Foreign demand may no longer offset U.S. fiscal expansion\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim: macro shocks could overpower trade deals<\/b><br/>The U.S. trade deficit could rise even if the administration<br/>secures new trade agreements\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    X[\"<b>Scale caveat<\/b><br/>Argentina and Turkey are individually too small to drive the full outcome\"]\n    QF[\"<b>Path uncertainty<\/b><br/>Italy and China's eventual adjustments are not predetermined\"]\n    R1[\"<b>Offsetting scenario<\/b><br/>Strong foreign demand could still counterbalance U.S. fiscal stimulus\"]\n  end\n\n  P3 --> M1\n  D1 --> M1\n  D2 --> M1\n  D5 --> M1\n  M1 --> C1\n\n  P3 --> M2\n  D3 --> M2\n  D4 --> M2\n  M2 --> C2\n\n  P1 --> M3\n  P2 --> M3\n  C1 --> M3\n  C2 --> M3\n  D6 --> C3\n  C3 --> M3\n  M3 --> K\n\n  C1 -.->|qualified by| X\n  C2 -.->|uncertain path| QF\n  C3 -.->|could be offset by| R1\n\n  C2 --> M3\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D1 & D2\n  P2 ~~~ D3 & D6\n  P3 ~~~ D4 & D5\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color:#04342C\n  classDef main fill:#E1F5EE,stroke:#0F6E56,color:#04342C,stroke-width:3px\n  classDef dia fill:#F1EFE8,stroke:#5F5E5A,color:#2C2C2A\n  classDef question fill:#FFFFFF,stroke:#2C2C2A,color:#2C2C2A\n\n  class P1,P2,P3 prior\n  class D1,D2,D3,D4,D5,D6 data\n  class M1,M2,M3,C1,C2,C3 mech\n  class K main\n  class X,QF,R1 dia\n  class Q question\n\n  linkStyle 16,17,18 stroke:#A32D2D,color:#A32D2D"}, {"file": "setser_may_2_19.mmd", "stem": "setser_may_2_19", "group": "Argument maps", "title": "If U.S.-China trade tensions escalate, will China keep the yuan stable or let it weaken?", "shape": "", "subtitle": "", "question": "If U.S.-China trade tensions escalate, will China keep the yuan stable or let it weaken? Brad Setser, CFR, May 2019", "date": "2 May 2019", "iso": "2019-05-02", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 23, "lines": 102, "code": "---\nconfig:\n  layout: elk\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>If U.S.-China trade tensions escalate,<br/>will China keep the yuan stable or let it weaken?<\/b><br/><i>Brad Setser, CFR, May 2019<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>China controls the yuan<\/b><br/>Reserves, capital controls, and policy tools give Beijing substantial exchange-rate control\"]\n    P2[\"<b>Depreciation offsets tariffs<\/b><br/>A weaker yuan lets exporters lower dollar prices while preserving yuan revenue\"]\n    P3[\"<b>Stability has value<\/b><br/>A stable currency supports confidence and reduces financial risk\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>Full tariffs would be substantial<\/b><br/>25% on nearly $550B of imports could raise roughly $100–140B\"]\n    D2[\"<b>Large potential China growth hit<\/b><br/>UBS: full tariffs plus retaliation could cut growth by about 1.5pp\"]\n    D3[\"<b>Recent yuan stability required little intervention<\/b><br/>No sustained pressure in either direction\"]\n    D4[\"<b>China retains external firepower<\/b><br/>Large reserves, state-bank foreign assets, and portfolio inflows\"]\n    D5[\"<b>Balance of payments broadly stable<\/b><br/>Trade surplus covers major outflows without sustained reserve pressure\"]\n    D6[\"<b>Manufacturing surplus ~ $1T<\/b><br/>Further export-oriented adjustment would matter globally\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Tariffs weaken Chinese export demand<\/b><br/>Higher U.S. import costs reduce competitiveness and growth\"]\n    M2[\"<b>Depreciation cushions exporters<\/b><br/>A weaker yuan offsets part of the tariff in dollar terms\"]\n    M3[\"<b>Stability protects domestic confidence<\/b><br/>Avoiding a large currency move limits financial instability\"]\n    M4[\"<b>Yuan weakness spreads outward<\/b><br/>Other Asian currencies weaken and trade pressure shifts globally\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>China has a genuine policy choice<\/b><br/>It is not mechanically forced into depreciation\"]\n    C2[\"<b>Depreciation can absorb part of the tariff shock<\/b><br/>Exporters can preserve competitiveness\"]\n    C3[\"<b>But depreciation carries domestic and strategic costs<\/b><br/>It risks instability and additional U.S. retaliation\"]\n    C4[\"<b>A weaker yuan redistributes trade pain<\/b><br/>Export-dependent economies outside China also come under pressure\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim: China's currency response is a strategic choice<\/b><br/>Beijing can defend stability or reset the yuan lower;<br/>its decision will shape the global impact of the trade war\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    X[\"<b>Case for stability<\/b><br/>China can support growth fiscally without risking a destabilizing currency move\"]\n    QF[\"<b>Implementation caveat<\/b><br/>Controlled depreciations are difficult because markets may front-run them\"]\n    R1[\"<b>Retaliation risk<\/b><br/>A weaker yuan could trigger broader or higher U.S. tariffs\"]\n    R2[\"<b>External-balance caveat<\/b><br/>Tariffs and oil prices could push China toward current-account deficit\"]\n  end\n\n  D1 --> M1\n  D2 --> M1\n\n  P2 --> M2\n  M1 --> M2\n\n  P3 --> M3\n  D3 --> M3\n  D4 --> M3\n  D5 --> M3\n\n  P1 --> C1\n  M2 --> C2\n  M3 --> C3\n  D6 --> M4\n  M2 --> M4\n  M4 --> C4\n\n  C1 --> K\n  C2 --> K\n  C3 --> K\n  C4 --> K\n\n  C1 -.->|supports alternative| X\n  C2 -.->|limited by| QF\n  C3 -.->|strategic risk| R1\n  C1 -.->|qualified by| R2\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D3 & D4 & D5\n  P2 ~~~ D1 & D2\n  P3 ~~~ D6\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color:#04342C\n  classDef main fill:#E1F5EE,stroke:#0F6E56,color:#04342C,stroke-width:3px\n  classDef dia fill:#F1EFE8,stroke:#5F5E5A,color:#2C2C2A\n  classDef question fill:#FFFFFF,stroke:#2C2C2A,color:#2C2C2A\n\n  class P1,P2,P3 prior\n  class D1,D2,D3,D4,D5,D6 data\n  class M1,M2,M3,M4,C1,C2,C3,C4 mech\n  class K main\n  class X,QF,R1,R2 dia\n  class Q question\n  linkStyle 18,19,20,21 stroke:#A32D2D,color:#A32D2D"}, {"file": "setser_may_10_19.mmd", "stem": "setser_may_10_19", "group": "Argument maps", "title": "If U.S.-China trade tensions escalate, will China keep the yuan stable or let it weaken?", "shape": "", "subtitle": "", "question": "If U.S.-China trade tensions escalate, will China keep the yuan stable or let it weaken? Brad Setser, CFR, May 2019", "date": "10 May 2019", "iso": "2019-05-10", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 23, "lines": 102, "code": "---\nconfig:\n  layout: elk\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>If U.S.-China trade tensions escalate,<br/>will China keep the yuan stable or let it weaken?<\/b><br/><i>Brad Setser, CFR, May 2019<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>China controls the yuan<\/b><br/>Reserves, capital controls, and policy tools give Beijing substantial exchange-rate control\"]\n    P2[\"<b>Depreciation offsets tariffs<\/b><br/>A weaker yuan lets exporters lower dollar prices while preserving yuan revenue\"]\n    P3[\"<b>Stability has value<\/b><br/>A stable currency supports confidence and reduces financial risk\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>Full tariffs would be substantial<\/b><br/>25% on nearly $550B of imports could raise roughly $100–140B\"]\n    D2[\"<b>Large potential China growth hit<\/b><br/>UBS: full tariffs plus retaliation could cut growth by about 1.5pp\"]\n    D3[\"<b>Recent yuan stability required little intervention<\/b><br/>No sustained pressure in either direction\"]\n    D4[\"<b>China retains external firepower<\/b><br/>Large reserves, state-bank foreign assets, and portfolio inflows\"]\n    D5[\"<b>Balance of payments broadly stable<\/b><br/>Trade surplus covers major outflows without sustained reserve pressure\"]\n    D6[\"<b>Manufacturing surplus ~ $1T<\/b><br/>Further export-oriented adjustment would matter globally\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Tariffs weaken Chinese export demand<\/b><br/>Higher U.S. import costs reduce competitiveness and growth\"]\n    M2[\"<b>Depreciation cushions exporters<\/b><br/>A weaker yuan offsets part of the tariff in dollar terms\"]\n    M3[\"<b>Stability protects domestic confidence<\/b><br/>Avoiding a large currency move limits financial instability\"]\n    M4[\"<b>Yuan weakness spreads outward<\/b><br/>Other Asian currencies weaken and trade pressure shifts globally\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>China has a genuine policy choice<\/b><br/>It is not mechanically forced into depreciation\"]\n    C2[\"<b>Depreciation can absorb part of the tariff shock<\/b><br/>Exporters can preserve competitiveness\"]\n    C3[\"<b>But depreciation carries domestic and strategic costs<\/b><br/>It risks instability and additional U.S. retaliation\"]\n    C4[\"<b>A weaker yuan redistributes trade pain<\/b><br/>Export-dependent economies outside China also come under pressure\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim: China's currency response is a strategic choice<\/b><br/>Beijing can defend stability or reset the yuan lower;<br/>its decision will shape the global impact of the trade war\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    X[\"<b>Case for stability<\/b><br/>China can support growth fiscally without risking a destabilizing currency move\"]\n    QF[\"<b>Implementation caveat<\/b><br/>Controlled depreciations are difficult because markets may front-run them\"]\n    R1[\"<b>Retaliation risk<\/b><br/>A weaker yuan could trigger broader or higher U.S. tariffs\"]\n    R2[\"<b>External-balance caveat<\/b><br/>Tariffs and oil prices could push China toward current-account deficit\"]\n  end\n\n  D1 --> M1\n  D2 --> M1\n\n  P2 --> M2\n  M1 --> M2\n\n  P3 --> M3\n  D3 --> M3\n  D4 --> M3\n  D5 --> M3\n\n  P1 --> C1\n  M2 --> C2\n  M3 --> C3\n  D6 --> M4\n  M2 --> M4\n  M4 --> C4\n\n  C1 --> K\n  C2 --> K\n  C3 --> K\n  C4 --> K\n\n  C1 -.->|supports alternative| X\n  C2 -.->|limited by| QF\n  C3 -.->|strategic risk| R1\n  C1 -.->|qualified by| R2\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D3 & D4 & D5\n  P2 ~~~ D1 & D2\n  P3 ~~~ D6\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color:#04342C\n  classDef main fill:#E1F5EE,stroke:#0F6E56,color:#04342C,stroke-width:3px\n  classDef dia fill:#F1EFE8,stroke:#5F5E5A,color:#2C2C2A\n  classDef question fill:#FFFFFF,stroke:#2C2C2A,color:#2C2C2A\n\n  class P1,P2,P3 prior\n  class D1,D2,D3,D4,D5,D6 data\n  class M1,M2,M3,M4,C1,C2,C3,C4 mech\n  class K main\n  class X,QF,R1,R2 dia\n  class Q question\n  linkStyle 18,19,20,21 stroke:#A32D2D,color:#A32D2D"}, {"file": "setser_jun_14_19.mmd", "stem": "setser_jun_14_19", "group": "Argument maps", "title": "Why did China's tariffs devastate some U.S. exports but have limited effects on others?", "shape": "", "subtitle": "", "question": "Why did China's tariffs devastate some U.S. exports but have limited effects on others? Brad Setser, CFR, June 2019", "date": "14 Jun 2019", "iso": "2019-06-14", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 22, "lines": 103, "code": "---\nconfig:\n  layout: elk\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Why did China's tariffs devastate some U.S. exports<br/>but have limited effects on others?<\/b><br/><i>Brad Setser, CFR, June 2019<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Tariff effects are sector-specific<\/b><br/>Substitution and market structure determine the aggregate impact\"]\n    P2[\"<b>Bilateral trade ≠ total trade<\/b><br/>Lost sales to China may be redirected elsewhere\"]\n    P3[\"<b>Retaliation requires viable substitutes<\/b><br/>China cannot easily stop buying essential imports\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>Commodity exports to China down >60%<\/b><br/>Much larger decline than manufacturing exports\"]\n    D2[\"<b>Soy exports effectively collapsed<\/b><br/>Farmers could not replace lost Chinese demand elsewhere\"]\n    D3[\"<b>Oil exports to China collapsed<\/b><br/>But total U.S. oil exports were largely unaffected\"]\n    D4[\"<b>Auto exports responded to the tariff<\/b><br/>Exports fell, then rebounded when China suspended it\"]\n    D5[\"<b>Manufacturing decline surprisingly modest<\/b><br/>Aggregate exports show little obvious tariff break\"]\n    D6[\"<b>China lacks substitutes in some sectors<\/b><br/>Aircraft and export-related inputs are poor retaliation targets\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Few alternative buyers magnify the shock<\/b><br/>Lost Chinese demand becomes lost total exports\"]\n    M2[\"<b>Alternative buyers divert trade<\/b><br/>Sales shift markets without reducing total exports\"]\n    M3[\"<b>Lack of substitutes weakens retaliation<\/b><br/>Chinese firms continue buying needed U.S. goods\"]\n    M4[\"<b>Other demand can absorb export losses<\/b><br/>Domestic sales or localization cushion production\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Soy retaliation was unusually effective<\/b><br/>Bilateral losses became aggregate export losses\"]\n    C2[\"<b>Oil retaliation mostly redirected trade<\/b><br/>Bilateral trade fell without much aggregate effect\"]\n    C3[\"<b>Manufacturing retaliation was weaker<\/b><br/>China had limited leverage in several key sectors\"]\n    C4[\"<b>Identical tariffs need not have identical effects<\/b><br/>Sector structure changes the transmission\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim: don't equate bilateral trade with aggregate impact<\/b><br/>The economic effect of tariffs depends heavily<br/>on substitution possibilities and sector structure\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    QF1[\"<b>Coverage caveat<\/b><br/>China had not tariffed all major U.S. manufacturing exports\"]\n    QF2[\"<b>Timing caveat<\/b><br/>China may have preserved targets for future retaliation\"]\n    R1[\"<b>Auto counterfactual<\/b><br/>SUV demand and production localization also affected output\"]\n  end\n\n  P1 --> M1\n  P1 --> M2\n  P2 --> M2\n  P3 --> M3\n\n  D2 --> M1\n  M1 --> C1\n\n  D3 --> M2\n  M2 --> C2\n\n  D5 --> M3\n  D6 --> M3\n  M3 --> C3\n\n  D4 --> M4\n  M4 --> C3\n\n  D1 --> C4\n  C1 --> C4\n  C2 --> C4\n  C3 --> C4\n\n  C4 --> K\n\n  C3 -.->|qualified by| QF1\n  C3 -.->|possible explanation| QF2\n  M4 -.->|other explanation| R1\n\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D1 & D2\n  P2 ~~~ D3 & D4\n  P3 ~~~ D5 & D6\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color:#04342C\n  classDef main fill:#E1F5EE,stroke:#0F6E56,color:#04342C,stroke-width:3px\n  classDef dia fill:#F1EFE8,stroke:#5F5E5A,color:#2C2C2A\n  classDef question fill:#FFFFFF,stroke:#2C2C2A,color:#2C2C2A\n\n  class P1,P2,P3 prior\n  class D1,D2,D3,D4,D5,D6 data\n  class M1,M2,M3,M4,C1,C2,C3,C4 mech\n  class K main\n  class QF1,QF2,R1 dia\n  class Q question\n  linkStyle 18,19,20 stroke:#A32D2D,color:#A32D2D"}, {"file": "setser_aug_13_19.mmd", "stem": "setser_aug_13_19", "group": "Argument maps", "title": "Why do the U.S., Europe, and China now occupy such different positions in manufacturing trade?", "shape": "", "subtitle": "", "question": "Why do the U.S., Europe, and China now occupy such different positions in manufacturing trade? Brad Setser, CFR, Aug 2019", "date": "13 Aug 2019", "iso": "2019-08-13", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 24, "lines": 104, "code": "---\nconfig:\n  layout: elk\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Why do the U.S., Europe, and China now occupy<br/>such different positions in manufacturing trade?<\/b><br/><i>Brad Setser, CFR, Aug 2019<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Trade shares reveal production structure<\/b><br/>Exports and imports relative to GDP show how economies engage globally\"]\n    P2[\"<b>Manufacturing balances reflect where production occurs<\/b><br/>Not simply how open an economy is\"]\n    P3[\"<b>Persistent deficits require financing<\/b><br/>Import bills must ultimately be covered by income or borrowing\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>U.S. manufacturing exports are unusually low<\/b><br/>About one-third of the euro area's level relative to GDP\"]\n    D2[\"<b>Manufacturing imports are similar<\/b><br/>U.S. and euro-area import shares are broadly comparable\"]\n    D3[\"<b>Mirror-image manufacturing balances<\/b><br/>U.S. deficit ~4–5% of GDP; euro-area surplus ~4%\"]\n    D4[\"<b>Offshore profits exceed the service-export story<\/b><br/>Foreign corporate earnings help finance the U.S. deficit\"]\n    D5[\"<b>Europe is highly export dependent<\/b><br/>Leaving it exposed to the global manufacturing downturn\"]\n    D6[\"<b>China's manufacturing trade is highly unbalanced<\/b><br/>Surplus ~7% of GDP; non-processing imports ~4%\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Offshoring weakens domestic exports<\/b><br/>'Design here, make abroad' shifts manufacturing production overseas\"]\n    M2[\"<b>Offshore profits finance goods deficits<\/b><br/>Foreign earnings offset part of the manufacturing import bill\"]\n    M3[\"<b>Export dependence transmits global weakness<\/b><br/>Manufacturing downturns hit Europe especially hard\"]\n    M4[\"<b>Low imports + high exports generate surplus<\/b><br/>China sells far more manufactures abroad than it buys\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>The U.S.-Europe gap is mainly an export gap<\/b><br/>U.S. imports are not unusually high relative to Europe\"]\n    C2[\"<b>U.S. globalization favored offshore profits<\/b><br/>More than domestically produced manufacturing exports\"]\n    C3[\"<b>Europe's strength creates cyclical exposure<\/b><br/>Its export model is vulnerable when global manufacturing slows\"]\n    C4[\"<b>China's manufacturing model is unusually one-sided<\/b><br/>Large exports coexist with relatively small manufactured imports\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K1[\"<b>Long-run U.S. claim<\/b><br/>The U.S. may need to rebuild a stronger manufacturing base rather than finance imports indefinitely\"]\n    K2[\"<b>Comparative claim<\/b><br/>Europe and China remain far more manufacturing-oriented,<br/>but with very different import structures\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    X[\"<b>Services explanation<\/b><br/>Some attribute the U.S. goods deficit to comparative advantage in services\"]\n    R1[\"<b>Resource-endowment explanation<\/b><br/>The shale boom reduces the need to export manufactures to pay for oil\"]\n    QF[\"<b>Comparison caveat<\/b><br/>Processing trade makes Europe-China comparisons imperfect\"]\n    R2[\"<b>Short-run tradeoff<\/b><br/>Europe's export strength also makes it vulnerable to industrial downturns\"]\n  end\n\n  P2 --> M1\n  D1 --> M1\n  M1 --> C1\n  D2 --> C1\n  D3 --> C1\n\n  P3 --> M2\n  D4 --> M2\n  M2 --> C2\n\n  D5 --> M3\n  M3 --> C3\n\n  P1 --> M4\n  D6 --> M4\n  M4 --> C4\n\n  C1 --> K1\n\n  C3 --> K2\n  C4 --> K2\n\n  C2 -.->|pushes back on| X\n  C1 -.->|other explanation| R1\n  C4 -.->|comparison caveat| QF\n  C3 -.->|tradeoff| R2\n\n  C2 --> K1\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D1 & D2\n  P2 ~~~ D3 & D4\n  P3 ~~~ D5 & D6\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color:#04342C\n  classDef main fill:#E1F5EE,stroke:#0F6E56,color:#04342C,stroke-width:3px\n  classDef dia fill:#F1EFE8,stroke:#5F5E5A,color:#2C2C2A\n  classDef question fill:#FFFFFF,stroke:#2C2C2A,color:#2C2C2A\n\n  class P1,P2,P3 prior\n  class D1,D2,D3,D4,D5,D6 data\n  class M1,M2,M3,M4,C1,C2,C3,C4 mech\n  class K1,K2 main\n  class X,R1,QF,R2 dia\n  class Q question\n  linkStyle 16,17,18,19 stroke:#A32D2D,color:#A32D2D"}, {"file": "setser_sep_20_19.mmd", "stem": "setser_sep_20_19", "group": "Argument maps", "title": "Why do global trade imbalances persist, and why could they worsen before improving?", "shape": "", "subtitle": "", "question": "Why do global trade imbalances persist, and why could they worsen before improving? Brad Setser, CFR, Sept 2019", "date": "20 Sep 2019", "iso": "2019-09-20", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L2", "L3", "L4", "L5", "L6"], "nodes": 24, "lines": 104, "code": "---\nconfig:\n  layout: elk\n  flowchart:\n    wrappingWidth: 170\n    nodeSpacing: 25\n    rankSpacing: 45\n---\nflowchart TD\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Why do global trade imbalances persist,<br/>and why could they worsen before improving?<\/b><br/><i>Brad Setser, CFR, Sept 2019<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Global surpluses require matching deficits<\/b><br/>If large economies save externally, another economy must absorb the surplus\"]\n    P2[\"<b>Fiscal policy shapes external balances<\/b><br/>Weak domestic demand tends to reduce imports and raise surpluses\"]\n    P3[\"<b>Excess saving generates surplus pressure<\/b><br/>Saving above domestic investment pushes capital and demand abroad\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    D1[\"<b>Europe and East Asia run large surpluses<\/b><br/>Together they roughly mirror the U.S. manufacturing deficit\"]\n    D2[\"<b>Europe remains fiscally tight<\/b><br/>Germany and other surplus economies run restrictive demand policies\"]\n    D3[\"<b>Asian surplus economies restrain demand/currencies<\/b><br/>Korea, Taiwan, Singapore, and Thailand remain export oriented\"]\n    D4[\"<b>China has a surplus despite huge fiscal support<\/b><br/>Current account ~$200–250B with augmented deficit near 12% of GDP\"]\n    D5[\"<b>China still saves ~44% of GDP<\/b><br/>East Asian aggregate saving remains close to 40%\"]\n    D6[\"<b>China's imports weakened in 2019<\/b><br/>Modest stimulus failed to offset tightening and the trade war\"]\n    D7[\"<b>U.S. net external debt ~45% of GDP<\/b><br/>Large relative to the country's limited export base\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Fiscal restraint suppresses domestic demand<\/b><br/>Lower imports and excess saving generate European surpluses\"]\n    M2[\"<b>Structural high saving generates surplus pressure<\/b><br/>China saves more than its economy can sustainably absorb\"]\n    M3[\"<b>Weak investment and imports raise China's surplus<\/b><br/>Less domestic absorption pushes the external balance upward\"]\n    M4[\"<b>Foreign surpluses require deficit absorption<\/b><br/>North America takes the other side through external deficits and debt\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Europe's imbalance is mainly a demand problem<\/b><br/>Looser fiscal policy could directly raise domestic absorption\"]\n    C2[\"<b>East Asia's imbalance is structurally harder<\/b><br/>China's underlying problem is exceptionally high saving\"]\n    C3[\"<b>China's current adjustment is fragile<\/b><br/>Large public investment prevents an even larger external surplus\"]\n    C4[\"<b>The U.S. cannot absorb surpluses forever<\/b><br/>Its external debt stock is already large relative to exports\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim: global imbalances could worsen first<\/b><br/>Europe still lacks demand and China's excess-saving problem remains;<br/>the U.S. cannot indefinitely absorb the resulting surpluses\"]\n  end\n\n  subgraph L6[\"Level 6 · Dialectic\"]\n    X[\"<b>U.S.-adjustment alternative<\/b><br/>Tighter U.S. fiscal policy would also reduce the American trade deficit\"]\n    R1[\"<b>Japan exception<\/b><br/>Japan runs a surplus despite relatively loose fiscal policy\"]\n    QF1[\"<b>U.S. sustainability caveat<\/b><br/>The current flow deficit is not obviously unsustainable today\"]\n    QF2[\"<b>China adjustment caveat<\/b><br/>Fiscal and credit stimulus currently absorbs much of China's excess saving\"]\n  end\n\n  P2 --> M1\n  D2 --> M1\n  M1 --> C1\n\n  P3 --> M2\n  D4 --> M2\n  D5 --> M2\n  M2 --> C2\n\n  D6 --> M3\n  M2 --> M3\n  M3 --> C3\n\n  P1 --> M4\n  D1 --> M4\n  D3 --> M4\n  M4 --> C4\n  D7 --> C4\n\n  C1 --> K\n  C2 --> K\n  C3 --> K\n  C4 --> K\n\n  C1 -.->|alternative adjustment| X\n  C1 -.->|doesn't fully explain| R1\n  C4 -.->|qualified by| QF1\n  C3 -.->|currently offset by| QF2\n\n  Q ~~~ P1 & P2 & P3\n  P1 ~~~ D1 & D3\n  P2 ~~~ D2 & D6\n  P3 ~~~ D4 & D5 & D7\n\n  classDef prior fill:#EEEDFE,stroke:#534AB7,color:#26215C\n  classDef unstated fill:#EEEDFE,stroke:#534AB7,color:#26215C,stroke-dasharray:5 4\n  classDef data fill:#E6F1FB,stroke:#185FA5,color:#042C53\n  classDef mech fill:#E1F5EE,stroke:#0F6E56,color: rect commodity purchases\"]\n    P2[\"<b>Hidden assumption<\/b><br/>The capacity to deliver purchases is the same capacity that can withdraw them\"]\n    P3[\"<b>Revised prior<\/b><br/>#quot;I was surprised by the size of China's impact... I thought U.S. soy would prove to be more of a pure commodity#quot; — and #quot;I don't think many expected#quot; reserves to stay stable\"]\n    ID[\"<b>Accounting identity<\/b><br/><i>n/a<\/i>\"]\n    SC[\"<b>Source credibility<\/b><br/>#quot;Chinese data never quite fully lines up, which bothers me more than most#quot;\"]\n  end\n\n  subgraph L1B[\"Level 1b · Frame & scope\"]\n    BM[\"<b>Benchmark<\/b><br/><i>n/a — retrospective, nothing scored<\/i>\"]\n    SCP[\"<b>Scope choice<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"<b>Data<\/b><br/>Yuan -8% vs USD and -4% vs basket; Treasury holdings flat once Belgian accounts are counted; China is two-thirds of global soybean imports; U.S. beans traded at a discount to Brazil\"]\n    E2[\"<b>Studies & sources<\/b><br/>His own Senate testimony; Toloui on balance-sheet policy; the Economist on managed trade\"]\n    E3[\"<b>Rival measurement<\/b><br/><i>absent<\/i>\"]\n    E4[\"<b>Discrepancy<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Mechanism A<\/b> · <i>kind: economic<\/i><br/>Outflow controls and the absence of carry-trade leverage prevented a 2015-style panic\"]\n    M2[\"<b>Mechanism B<\/b> · <i>kind: economic<\/i><br/>Treasuries carry no leverage — if China pushed yields up, the Fed would simply react\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Intermediate claim<\/b><br/>Five parallel verdicts: industrial policy untouched, currency buffered, Treasuries unused, manufactures spared, ag and energy targeted\"]\n    C2[\"<b>Case type<\/b><br/><i>n/a<\/i>\"]\n    C3[\"<b>Policy reductio<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim<\/b> · <i>type: single<\/i><br/>China can meet its 2020 commitments — and that is precisely the risk.<br/>#quot;What China's state gives, China's state can take away#quot;\"]\n    RC[\"<b>Reconstruction<\/b><br/><i>n/a<\/i>\"]\n    REC[\"<b>Recommendation<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"<b>Opposing view<\/b><br/>Both approaches carry costs — managed trade rewards diversion away from allies, while the conventional approach changed little in 2010-11\"]\n    QF[\"<b>Caveat<\/b><br/>Tech decoupling will not bite in 2020: Boeing's own problems, no indigenous jet engines, semiconductors too early\"]\n    R1[\"<b>Other explanation<\/b><br/>Why were manufactures spared? #quot;I am not quite sure why this is the case#quot; — two theories offered, neither chosen\"]\n    DF[\"<b>Deferred question<\/b><br/><i>absent<\/i>\"]\n  end\n\n  P3 -.->|revises| P1\n  P1 -->|licenses| C1\n  E1 -->|supports| M1\n  E1 -->|supports| C1\n  E2 -->|supports| C1\n  M1 -->|supports| C1\n  M2 -->|supports| C1\n  SC -.->|undercut by| E1\n  C1 -->|supports| K\n  P2 -->|licenses| K\n  K -.->|rebuts| X\n  K -.->|qualified by| QF\n  C1 -.->|undercut by| R1\n\n  T ~~~ L0\n  L0 ~~~ L1\n  L1 ~~~ L1B\n  L1B ~~~ L2\n  L2 ~~~ L3\n  L3 ~~~ L4\n  L4 ~~~ L5\n  L5 ~~~ L6\n\n\n  subgraph LEG[\"How to read this\"]\n    G1[\"<b>Filled<\/b><br/>the article does this\"]\n    G2[\"<b>Implicit<\/b><br/>present, but never stated outright\"]\n    G3[\"<b>Empty<\/b><br/><i>n/a<\/i> = category error here<br/><i>absent<\/i> = could have, did not\"]\n  end\n\n  classDef title fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8,stroke-width:2px\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef revised fill:#7A2B4D,stroke:#F0A8C4,color:#FBE4EE,stroke-width:2px\n  classDef cred fill:#5A2E7A,stroke:#CFA8EC,color:#F3E4FB\n  classDef data fill:#0C447C,stroke:#85B7 he recommendation slot.<br/><br/>14 of 26 slots filled\"]\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Question<\/b><br/>Emerging economies face the same shocks — do they need the same response?\"]\n    ANOM[\"<b>Anomaly<\/b><br/><i>n/a<\/i>\"]\n    POS[\"<b>Position map<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Stated assumption<\/b><br/>Shocks can offset one another; swap lines fund dollar balance sheets, not balance-of-payments gaps\"]\n    P2[\"<b>Hidden assumption<\/b><br/>The external balance sheet is the right thing to sort countries by\"]\n    P3[\"<b>Revised prior<\/b><br/>#quot;contrary to a forecast that I made with Dr. Roubini back in 2005#quot; — private credit intermediation broke down before central banks lost their appetite for intervention\"]\n    ID[\"<b>Accounting identity<\/b><br/><i>absent<\/i>\"]\n    SC[\"<b>Source credibility<\/b><br/><i>n/a<\/i>\"]\n  end\n\n  subgraph L1B[\"Level 1b · Frame & scope\"]\n    BM[\"<b>Benchmark<\/b><br/><i>n/a<\/i>\"]\n    SCP[\"<b>Scope choice<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"<b>Data<\/b><br/>Brent under $25, below almost every exporter's breakeven; Saudi reserves ~$500bn; GCC sovereign funds over $1tn; copper at multiyear lows\"]\n    E2[\"<b>Studies & sources<\/b><br/>Truman on IMF lending capacity; Landers, Lee and Morris on callable capital; Hagan and Buchheit on maturity extension; Carstens and the BIS on trade finance\"]\n    E3[\"<b>Rival measurement<\/b><br/><i>n/a<\/i>\"]\n    E4[\"<b>Discrepancy<\/b><br/><i>n/a<\/i>\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Mechanism A<\/b> · <i>kind: economic<\/i><br/>The same four shocks land very differently depending on the external balance sheet\"]\n    M2[\"<b>Mechanism B<\/b> · <i>kind: economic<\/i><br/>Swap lines solve dollar funding, but were never designed to cover a balance-of-payments shortfall\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Intermediate claim<\/b><br/>Countries with strong external balance sheets can weather this themselves if they act decisively\"]\n    C2[\"<b>Case type<\/b><br/>Three types — reserve-rich commodity exporters, Asian surplus creditors, weak external balance sheets — and the last splits again into trade finance and balance-of-payments need\"]\n    C3[\"<b>Policy reductio<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim<\/b> · <i>type: typology<\/i><br/>#quot;Different problems require different solutions#quot; — when private capital retreats, the official sector must advance\"]\n    RC[\"<b>Reconstruction<\/b><br/><i>n/a<\/i>\"]\n    REC[\"<b>Recommendation<\/b><br/>Draw down buffers; central bank backstop plus swap lines; mobilise trade finance; SDR allocation, larger IMF capacity, MDB callable capital, payment deferral\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"<b>Opposing view<\/b><br/>Private creditors would rather be paid — #quot;this will take goodwill#quot;\"]\n    QF[\"<b>Caveat<\/b><br/>SDRs are allocated by quota rather than need, so they are insufficient alone; MDB capital would need legislation\"]\n    R1[\"<b>Other explanation<\/b><br/><i>absent<\/i>\"]\n    DF[\"<b>Deferred question<\/b><br/><i>absent<\/i>\"]\n  end\n\n  P3 -.->|revises| P1\n  P1 -->|supports| M1\n  E1 -->|supports| M1\n  M1 -->|supports| C1\n  P2 -->|licenses| C2\n  M1 -->|supports| C2\n  C1 -->|supports| K\n  C2 -->|supports| K\n  M2 -->|licenses| REC\n  E2 -->|supports| REC\n  C2 -->|supports| REC\n  K -->|motivates| REC\n  K -.->|rebuts| X\n  REC -.->|qualified by| QF\n\n  T ~~~ L0\n  L0 ~~~ L1\n  L1 ~~~ L1B\n  L1B ~~~ L2\n  L2 ~~~ L3\n  L3 ~~~ L4\n  L4 ~~~ L5\n  L5 ~~~ L6\n\n\n  subgraph LEG[\"How to read this\"]\n    G1[\"<b>Filled<\/b><br/>the article does this\"]\n    G2[\"<b>Implicit<\/b><br/>present, but never stated outright\"]\n    G3[\"<b>Empty<\/b><b rder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 180\n    nodeSpacing: 22\n    rankSpacing: 40\n---\nflowchart TD\n\n  T[\"<b>Jul 2020 · #quot;Slouching Toward Phase One#quot;<\/b><br/><b>Shape B · benchmark audit<\/b><br/>The only article that lights up Level 1b. Everything is scored against a target someone else set.<br/><br/>14 of 26 slots filled\"]\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Question<\/b><br/>Is China on track to meet its Phase One purchase commitments?\"]\n    ANOM[\"<b>Anomaly<\/b><br/><i>n/a<\/i>\"]\n    POS[\"<b>Position map<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Stated assumption<\/b><br/>Agriculture and energy flow through a few state firms, so purchases can be directed; manufacturing cannot\"]\n    P2[\"<b>Hidden assumption<\/b><br/>A deal with numerical targets may be judged on those targets alone\"]\n    P3[\"<b>Revised prior<\/b><br/><i>absent<\/i>\"]\n    ID[\"<b>Accounting identity<\/b><br/><i>n/a<\/i>\"]\n    SC[\"<b>Source credibility<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L1B[\"Level 1b · Frame & scope\"]\n    BM[\"<b>Benchmark<\/b><br/>The deal's own numbers — a 2017 baseline, roughly $60bn above it, a $164.65bn target across the codes in Annex 6.1\"]\n    SCP[\"<b>Scope choice<\/b><br/>Services excluded because in-China sales are not exports; aircraft adjusted out; only the listed HS codes counted\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"<b>Data<\/b><br/>First-half pace implies ~$83bn, below the 2017 baseline of ~$101bn and even below 2019; energy at 7% of its target; 1m barrels a day at $40 still yields only $7.36bn\"]\n    E2[\"<b>Studies & sources<\/b><br/>PIIE purchase tracker; Reuters on crude loadings; S&P Global on cancelled LNG cargoes; IMF growth forecast\"]\n    E3[\"<b>Rival measurement<\/b><br/><i>absent<\/i>\"]\n    E4[\"<b>Discrepancy<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Mechanism A<\/b> · <i>kind: economic<\/i><br/>There is no policy lever in manufacturing — import substitution continues and trade does not run through a few buyers\"]\n    M2[\"<b>Mechanism B<\/b> · <i>kind: economic<\/i><br/>Seasonality blocks catch-up, and because targets are nominal a commodity price crash widens the gap without any change in volume\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Intermediate claim<\/b><br/>Category by category: manufacturing will not close the gap, agriculture is behind but Q4 is still live, energy is effectively impossible\"]\n    C2[\"<b>Case type<\/b><br/><i>absent — categories are scored, not sorted into kinds<\/i>\"]\n    C3[\"<b>Policy reductio<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim<\/b> · <i>type: single<\/i><br/>The deal is failing on its own terms — insisting on impressive numbers made the shortfall easy to demonstrate\"]\n    RC[\"<b>Reconstruction<\/b><br/><i>n/a<\/i>\"]\n    REC[\"<b>Recommendation<\/b><br/><i>absent — the better deal is raised as a counterfactual, not a proposal<\/i>\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"<b>Opposing view<\/b><br/>Raised up front and rebutted: #quot;the purchase commitments themselves were a mistake#quot; and #quot;COVID-19 changed everything#quot;. A barrier-removal deal might have worked — but would not have produced a big number\"]\n    QF[\"<b>Caveat<\/b><br/>Agriculture could still deliver in Q4, which creates a real cost to abandoning the deal now\"]\n    R1[\"<b>Other explanation<\/b><br/>The aircraft collapse is exogenous — the largest category fell with the 737 MAX grounding, not with the deal\"]\n    DF[\"<b>Deferred question<\/b><br/><i>absent<\/i>\"]\n  end\n\n  SCP -->|bounds| BM\n  BM -->|compared against| E1\n  E2 -->|supports| E1\n  P1 -->|supports| M1\n  E1 -->|supports| C1\n  M1 -->|supports| C1\n  M2 -->|supports| C1\n  BM -->|licenses| C1\n  C1 -->|supports| K\n  P2 -->|licenses| K\n  K -.->|rebuts| X\n  C1 -.->|qualified by| QF\n  C1 -.->|undercut by| R1\n\n  T ~~~ L0\n  L0 ~~~ L1\n  L1 ~~~ L1B\n  L1B ~~~ L2\n  L2 ~~~ L3\n  L3 ~~~ L4\n  L4 ~~~ L5\n  L5 ~~~ L6\n\n\n  subgraph LEG[\"How to read this\"]\n    G1[\"<b>Filled<\/b><br/>the article does this\"]\n    G2[\"<b>Implicit<\/b><br/>present, but never stated outright\"]\n    G3[\"<b>Empty<\/b><br/><i>n/a<\/i> = category error here<br/><i>absent<\/i> = could have, did not\"]\n  end\n\n  classDef title fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8,stroke-width:2px\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef bench fill:#6B5410,stroke:#E8CE7A,color:#FBF3DC,stroke-width:2px\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef main fill:#085041,stroke:#9FE1CB,color:#E1F5EE,stroke-width:3px\n  classDef dia fill:#444441,stroke:#B4B2A9,color:#F1EFE8\n  classDef question fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8\n  classDef implicit fill:#2A2A45,stroke:#7A79A8,color:#C9C8E4\n  classDef legdemo fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef ghost fill:#1C1C1B,stroke:#4A4945,color:#6B6A65,stroke-dasharray:4 4\n\n  class T title\n  class Q question\n  class P1 prior\n  class P2 unstated\n  class BM,SCP bench\n  class E1,E2 data\n  class M1,M2 mech\n  class C1 mech\n  class K main\n  class X,QF,R1 dia\n  class ANOM,POS,P3,ID,SC,E3,E4,C2,C3,RC,REC,DF ghost\n  class G1 legdemo\n  class G2 implicit\n  class G3 ghost\n"}, {"file": "setser_mar_10_24.mmd", "stem": "setser_mar_10_24", "group": "Argument maps", "title": "China's Record Manufacturing Surplus", "shape": "Shape C · measurement critique, with a policy reductio", "subtitle": "", "question": "Is China's centrality to global manufacturing really declining, as the fragmentation narrative suggests?", "date": "10 Mar 2024", "iso": "2024-03-10", "author": "", "outlet": "", "url": "", "topics": "", "genre": "", "levels": ["L0", "L1", "L1B", "L2", "L3", "L4", "L5", "L6"], "nodes": 30, "lines": 137, "code": "---\nconfig:\n  layout: elk\n  theme: dark\n  themeVariables:\n    lineColor: \"#D3D1C7\"\n    clusterBkg: \"#262624\"\n    clusterBorder: \"#5F5E5A\"\n    titleColor: \"#F1EFE8\"\n    edgeLabelBackground: \"#2C2C2A\"\n  flowchart:\n    wrappingWidth: 180\n    nodeSpacing: 22\n    rankSpacing: 40\n---\nflowchart TD\n\n  T[\"<b>Mar 2024 · #quot;China's Record Manufacturing Surplus#quot;<\/b><br/><b>Shape C · measurement critique, with a policy reductio<\/b><br/>The only article that uses an accounting identity openly, and the only one that turns an opponent's own advice against them.<br/><br/>17 of 26 slots filled\"]\n\n  subgraph L0[\"Level 0 · Question\"]\n    Q[\"<b>Question<\/b><br/>Is China's centrality to global manufacturing really declining, as the fragmentation narrative suggests?\"]\n    ANOM[\"<b>Anomaly<\/b><br/><i>n/a<\/i>\"]\n    POS[\"<b>Position map<\/b><br/><i>absent<\/i>\"]\n  end\n\n  subgraph L1[\"Level 1 · Priors & assumptions\"]\n    P1[\"<b>Stated assumption<\/b><br/>Bilateral data misleads about global position — rerouting is not displacement\"]\n    P2[\"<b>Hidden assumption<\/b><br/>A correctly measured imbalance ought to drive policy\"]\n    P3[\"<b>Revised prior<\/b><br/><i>absent<\/i>\"]\n    ID[\"<b>Accounting identity<\/b><br/>#quot;A large manufacturing surplus requires an offsetting deficit in manufactures elsewhere#quot; — stated, and used to locate the counterpart\"]\n    SC[\"<b>Source credibility<\/b><br/>The reported current account #quot;misleads#quot; — flagged, with the full case made in the August companion piece\"]\n  end\n\n  subgraph L1B[\"Level 1b · Frame & scope\"]\n    BM[\"<b>Benchmark<\/b><br/><i>n/a<\/i>\"]\n    SCP[\"<b>Scope choice<\/b><br/>SITC categories 5 through 9, the standard manufactures breakout, from the long UN Comtrade series\"]\n  end\n\n  subgraph L2[\"Level 2 · Evidence\"]\n    E1[\"<b>Data<\/b><br/>Surplus at ~2% of world GDP, above peak Japan and Germany; 80% of solar panels; 35% of manufacturing output against 15% of global output\"]\n    E2[\"<b>Studies & sources<\/b><br/>Baldwin on sole manufacturing superpower; Pettis on production giant and consumption pygmy; Bown on the tariff timeline; OECD value-added data\"]\n    E3[\"<b>Rival measurement<\/b><br/><i>absent<\/i>\"]\n    E4[\"<b>Discrepancy<\/b><br/>Manufacturing surplus near 2% of world GDP against a reported current account of just 1.5% of China's own GDP\"]\n  end\n\n  subgraph L3[\"Level 3 · Mechanisms\"]\n    M1[\"<b>Mechanism A<\/b> · <i>kind: economic<\/i><br/>Policy, not only comparative advantage — resistance to consumer stimulus and a thin safety net sustain a savings surplus\"]\n    M2[\"<b>Mechanism B<\/b> · <i>kind: economic<\/i><br/>Upgrading is the stated growth plan, so advanced manufacturing capacity keeps expanding\"]\n  end\n\n  subgraph L4[\"Level 4 · Intermediate claims\"]\n    C1[\"<b>Intermediate claim<\/b><br/>The counterpart to the surplus is the United States, not commodity exporters, and the gap keeps widening as a share of world GDP\"]\n    C2[\"<b>Case type<\/b><br/><i>absent<\/i>\"]\n    C3[\"<b>Policy reductio<\/b><br/>Take the IMF's own advice — consolidate 7.5pp of GDP, cut rates, loosen the currency — run it through IMF-derived econometrics, and the current account rises about 4pp of China's GDP. The cure enlarges the disease.\"]\n  end\n\n  subgraph L5[\"Level 5 · Conclusion\"]\n    K[\"<b>Main claim<\/b> · <i>type: single<\/i><br/>The imbalance is large, growing and mismeasured — it shows up everywhere except in the reported current account and in the IMF's analysis\"]\n    RC[\"<b>Reconstruction<\/b><br/><i>absent — corrected measure asserted, not rebuilt here<\/i>\"]\n    REC[\"<b>Recommendation<\/b><br/>The size of the imbalance, correctly measured, must be factored into Chinese policymaking and into external policy advice\"]\n  end\n\n  subgraph L6[\"Level 6 · Counterpoints\"]\n    X[\"<b>Opposing view<\/b><br/>The standard view that the post-crisis fall in China's current account means external imbalances are no longer pressing\"]\n    QF[\"<b>Caveat<\/b><br/>Specialisation does partly reflect a large population and limited resources; the comprehensive data also lags and misses the 2020-2022 surge\"]\n    R1[\"<b>Other explanation<\/b><br/><i>absent<\/i>\"]\n    DF[\"<b>Deferred question<\/b><br/><i>absent<\/i>\"]\n  end\n\n  SCP -->|bounds| E1\n  SC -->|supports| E4\n  E1 -->|supports| C1\n  E2 -->|supports| C1\n  E4 -->|supports| C1\n  ID -->|licenses| C1\n  P1 -->|licenses| C1\n  M1 -->|supports| C1\n  M2 -->|supports| C1\n  C1 -->|supports| K\n  C1 -->|supports| C3\n  C3 -->|supports| K\n  K -->|motivates| REC\n  P2 -->|licenses| REC\n  K -.->|rebuts| X\n  K -.->|qualified by| QF\n\n  T ~~~ L0\n  L0 ~~~ L1\n  L1 ~~~ L1B\n  L1B ~~~ L2\n  L2 ~~~ L3\n  L3 ~~~ L4\n  L4 ~~~ L5\n  L5 ~~~ L6\n\n\n  subgraph LEG[\"How to read this\"]\n    G1[\"<b>Filled<\/b><br/>the article does this\"]\n    G2[\"<b>Implicit<\/b><br/>present, but never stated outright\"]\n    G3[\"<b>Empty<\/b><br/><i>n/a<\/i> = category error here<br/><i>absent<\/i> = could have, did not\"]\n  end\n\n  classDef title fill:#2C2C2A,stroke:#F1EFE8,color:#F1EFE8,stroke-width:2px\n  classDef prior fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE\n  classDef unstated fill:#3C3489,stroke:#AFA9EC,color:#EEEDFE,stroke-dasharray:5 4\n  classDef ident fill:#5146B5,stroke:#CFC9F7,color:#EEEDFE,stroke-width:3px\n  classDef cred fill:#5A2E7A,stroke:#CFA8EC,color:#F3E4FB\n  classDef bench fill:#6B5410,stroke:#E8CE7A,color:#FBF3DC,stroke-width:2px\n  classDef data fill:#0C447C,stroke:#85B7EB,color:#E6F1FB\n  classDef mech fill:#085041,stroke:#5DCAA5,color:#E1F5EE\n  classDef red fill:#7A4310,stroke:#EBA869,color:#FBEFE6,stroke-width:2px\n
