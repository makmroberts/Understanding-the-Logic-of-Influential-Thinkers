# Install into a venv outside OneDrive, then run `python -m annotate ...` from this folder:
#   py -3.12 -m venv C:\Users\<you>\envs\annotation
#   C:\Users\<you>\envs\annotation\Scripts\pip install -e .
# Versions are pinned: LangGraph releases several times a month.
[project]
name = "annotate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.2",
  "openai==3.45.0",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
# The meaning check in the evaluation (settings.yaml `meaning`): about 1 GB of packages
# and a 1.4 GB model, so it is opt-in: pip install -e .[meaning]
meaning = [
  "sentence-transformers==6.3.0",
  "transformers==5.22.2",
  "torch==2.15.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
