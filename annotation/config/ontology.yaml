# The argument vocabulary the pipeline extracts against. The code reads roles, relations,
# ID rules and level order from this file, so a new ontology means a new file, not new code.
#
# Sources:
#   kb/mermaid_code/second_flow_template.mmd          slot IDs, levels, one-line definitions
#   .claude/skills/predict-vs-actual/CODEBOOK.md      definitions and boundaries
#   proposed_architecture/config/proposed_ontology.yaml (commit da38b19)   role and relation IDs, signs
#   WORKED_EXAMPLE.md on origin/feat/worked_examples  how annotators actually cut an article
# The role and relation IDs equal kb/scripts/schema_map.yaml, so model output loads into the
# knowledge base unchanged. The generic `counterpoint` exists in the data only as a parser
# fallback; the model is never offered it.

id: setser_argument

version: 3
# v3 (2026-11-18), draft; not yet evaluated against the hand-drawn maps.
# Changes from v2:
#   all roles          expanded definitions, boundaries, and role-specific guidance
#   evidence_data      includes qualitative observations when used as evidence
#   evidence_rival     clarified distinction from evidence_discrepancy to avoid redundant boxes
#   hidden_assumption  restricted to essential, unstated, nontrivial premises
#   intermediate_claim must be a distinct conclusion derived from prior reasoning
#   main_claim         prefer one central conclusion; multiple only when necessary
#   other roles        clarified boundaries to reduce misclassification and over-extraction
# Existing levels, role IDs, attributes, relations, and granularity structure preserved.
# Pipeline update needed: boxes.py must read the new guidance fields.
# Model settings and evaluation results from v2 do not automatically apply to v3.

levels: [L0, L1, L1B, L2, L3, L4, L5, L6]      # reading order; links run forward through it

# name: the header a box gets in the knowledge base, as on the template.
# id: the slot ID a box gets. A fixed ID repeats as K2, X2 ...; a group shares one counter in
# the order the boxes are listed here, as the hand-drawn maps do (P1, P2, P3; E1, E2; M1, M2).
roles:
  question:
    name: Question
    level: L0
    id: Q
    definition: >-
      The central question or problem motivating the author's argument.
    boundary: >-
      Must represent the article's main inquiry, not a minor question or the title alone. 
      Infer only when the underlying question is clearly identifiable.
    guidance: >-
      Express in one sentence and mark as implicit if inferred. Do not force a question where no
      distinct central inquiry can be established.
  position_map:
    name: Position map
    level: L0
    id: POS
    definition: >-
      A description of multiple identifiable actors and their differing positions in a debate.
    boundary: >-
      Requires at least two distinct positions attributed to identifiable actors, not general 
      disagreement or a single opposing view.
    guidance: >-
      Capture who holds which position without evaluating their validity. Use opposing_view 
      when the author challenges one particular position.
  anomaly:
    name: Anomaly
    level: L0
    id: ANOM
    definition: >-
      An identifiable prediction or forecast that failed, motivating the author's investigation.
    boundary: >-
      Requires a specific prior expectation contradicted by an observed outcome. General 
      surprises or unexplained observations do not qualify.
    guidance: >-
      Identify the failed prediction and actual outcome. Use evidence_data for observations 
      without a specific failed prediction, and revised_prior when the author acknowledges 
      revising their own earlier belief.

  stated_assumption:
    name: Stated assumption
    level: L1
    group: P
    definition: >-
      An explicitly stated premise the author accepts without providing supporting argument.
    boundary: >-
      Must function as a premise, not an observation or conclusion.
      If the author provides evidence for it, classify accordingly.
    guidance: >-
      Separate a general premise from its application when both are distinct reasoning steps. 
      Use hidden_assumption only when the premise is unstated.
  hidden_assumption:
    name: Hidden assumption
    level: L1
    group: P
    definition: >-
      An unstated, nontrivial premise essential to a specific step in the author's reasoning.
    boundary: >-
      Removing the premise must break the inference. Exclude established economic identities, 
      widely accepted facts, and general background knowledge. Do not infer a hidden
      assumption merely to fill a perceived gap.
    guidance: >-
      Identify the specific inference that depends on the premise. Extract only when the author 
      relies on a substantive, unstated belief that is not necessarily universally accepted. 
      Most articles may have none. Cite the paragraph containing the dependent inference.
  revised_prior:
    name: Revised prior
    level: L1
    group: P
    definition: >-
      An earlier belief or prediction the author explicitly
      acknowledges was mistaken or requires revision.
    boundary: >-
      Requires an identifiable prior belief and its revision
      by the author. Other people's errors are not revised_prior.
    guidance: >-
      Use opposing_view for positions attributed to others.
      Do not infer belief revision from a change in emphasis.
  accounting_identity:
    name: Accounting identity
    level: L1
    id: ID
    definition: >-
      An accounting relationship that must hold by definition
      and serves as a premise in the argument.
    boundary: >-
      Must be explicitly invoked and used in the reasoning,
      not merely a numerical relationship or empirical pattern.
    guidance: >-
      Use hidden_assumption when an accounting identity is necessary but unstated. 
      Distinguish identities from empirical regularities that may not always hold.
  source_credibility:
    name: Source credibility
    level: L1
    id: SC
    definition: >-
      An assessment of the reliability or incentives of a source producing evidence.
    boundary: >-
      Must concern the trustworthiness of the source, not simply disagreement between measurements.
    guidance: >-
      Use evidence_source when citing an authority and evidence_discrepancy when 
      identifying conflicting data. Assessments of methodology also qualify when used 
      to judge source reliability.

  scope_choice:
    name: Scope choice
    level: L1B
    id: SCP
    definition: >-
      An explicit analytical choice about what is included,
      excluded, or measured that materially affects the conclusion.
    boundary: >-
      Must be a consequential choice of definition, population, timeframe, or measurement 
      scope, not routine context or an unstated premise.
    guidance: >-
      Identify how the chosen scope affects the analysis. Use hidden_assumption only for 
      necessary, unstated, nontrivial premises rather than explicit scope decisions.
  benchmark:
    name: Benchmark
    level: L1B
    id: BM
    definition: >-
      An externally established reference standard or target
      against which the author evaluates evidence.
    boundary: >-
      Must be specific, external to the author's own expectations,and actively used in 
      comparison rather than mentioned as background.
    guidance: >-
      Identify the standard and what it is compared against. Use evidence_data for observed 
      values and stated_assumption for the author's own unargued expectations.

  evidence_data:
    name: Data
    level: L2
    group: E
    definition: >-
      An empirical observation, statistic, or qualitative finding
      used to support or challenge an argumentative claim.
    boundary: >-
      Must serve as evidence, not background context, causal explanation, or interpretation. 
      Group related observations that establish one point into a single node.
    guidance: >-
      Use mechanism for causal explanations and intermediate_claim
      or main_claim for conclusions drawn from evidence.
  evidence_source:
    name: Studies and sources
    level: L2
    group: E
    definition: >-
      A study, report, dataset, or expert invoked as evidentiary
      authority for a claim.
    boundary: >-
      Create a separate node only when the source makes a distinct
      argumentative contribution, not for routine attribution.
    guidance: >-
      Use evidence_data for observations with incidental citations;
      use source_credibility for judgments about source reliability.
  evidence_rival:
    name: Rival measurement
    level: L2
    group: E
    definition: >-
      An alternative measurement of the same underlying quantity,
      used to compare, corroborate, or challenge existing evidence.
    boundary: >-
      Requires two comparable measurements, not merely related indicators. The alternative
      must serve a distinct argumentative purpose.
    guidance: >-
      If only the disagreement matters, use evidence_discrepancy.
      Extract both roles only when each contributes a separate point.
  evidence_discrepancy:
    name: Discrepancy
    level: L2
    group: E
    definition: >-
      A consequential disagreement between measurements of the same quantity, 
      used as evidence in the argument.
    boundary: >-
      Requires an explicit or clearly established comparison. Do not extract incidental 
      differences or duplicate a rival measurement without a distinct argumentative purpose.
    guidance: >-
      Describe the disagreement without assuming which measure is correct. Use source_credibility 
      for judgments about the reliability of a source.


  mechanism:
    name: Mechanism
    level: L3
    group: M
    definition: >-
      A causal process explaining how or why one condition produces an outcome.
    boundary: >-
      Must identify a causal channel, not merely an observed relationship or conclusion. 
      Extract separately only when the process contributes a distinct reasoning step.
    guidance: >-
      Separate causal explanations from supporting evidence. Use evidence_data for 
      observations and intermediate_claim for conclusions. Distinguish economic processes 
      from measurement distortions.
    attributes:
      kind: [economic, distortion]

  intermediate_claim:
    name: Intermediate claim
    level: L4
    group: C
    definition: >-
      A distinct conclusion drawn from earlier steps in the
      argument that contributes to the author's main conclusion.
    boundary: >-
      Must follow from preceding evidence, premises, or reasoning and stand as a meaningful 
      conclusion on its own. May support or form part of the main conclusion, but must not 
      simply restate it.
    guidance: >-
      Extract separate nodes for distinct intermediate conclusions. A mechanism is not required. 
      Do not classify observations, assumptions, or causal processes as intermediate claims.
  case_type:
    name: Case type
    level: L4
    group: C
    definition: >-
      A classification that divides an argument into distinct cases with different 
      implications or outcomes.
    boundary: >-
      Requires at least two meaningful cases with different consequences, not merely a 
      list of examples or categories.
    guidance: >-
      Identify the distinction between cases and why it matters to the reasoning. Use 
      intermediate_claim when the author draws a conclusion rather than distinguishes cases.
  policy_reductio:
    name: Policy reductio
    level: L4
    group: C
    definition: >-
      An argument challenging another actor's policy proposal by showing a consequence 
      they would reject.
    boundary: >-
      Must trace the implications of a proposal the author does not advocate. General policy 
      criticism or disagreement alone does not qualify.
    guidance: >-
      Identify the proposal and the consequence used to challenge it. Use opposing_view 
      for a disputed position without a demonstrated implication.

  main_claim:
    name: Main claim
    level: L5
    id: K
    definition: >-
      The author's central conclusion, representing the overall finding or position 
      established by the argument.
    boundary: >-
      Must express a final substantive conclusion, not an intermediate inference. Prefer one 
      main claim per article; use multiple only when the author establishes distinct, equally 
      central conclusions that cannot reasonably be combined.
    guidance: >-
      Identify what the author ultimately establishes, regardless of where it appears in the 
      text. Use intermediate_claim for supporting conclusions. Do not create additional main
      claims solely because an intermediate finding is important.
    attributes:
      claim_type: [single, enumerated, typology, unresolved]
  reconstruction:
    name: Reconstruction
    level: L5
    id: RC
    definition: >-
      A replacement estimate or quantity constructed after identifying shortcomings in an 
      existing measurement.
    boundary: >-
      Requires an identifiable rejected or challenged measurement and a substantive replacement. 
      A new estimate without a challenged counterpart is evidence.
    guidance: >-
      Identify the original measurement and its replacement. Use evidence_discrepancy when 
      the disagreement itself is the finding, without constructing a replacement.
  recommendation:
    name: Recommendation
    level: L5
    id: REC
    definition: >-
      A specific action or policy the author advocates in response to the argument's findings.
    boundary: >-
      Must express a normative prescription directed toward an identifiable actor. Describing 
      consequences or stating that an issue matters is not a recommendation.
    guidance: >-
      Identify the advocated action and its intended purpose. Use main_claim for substantive 
      conclusions that do not prescribe action.

  opposing_view:
    name: Opposing view
    level: L6
    id: X
    definition: >-
      A position or argument held by others that the author challenges through their reasoning.
    boundary: >-
      Must represent an identifiable opposing position, not merely a different perspective 
      or background debate.
    guidance: >-
      Extract the challenged position regardless of where it appears. Use position_map for 
      neutral descriptions of multiple views and policy_reductio when the author challenges 
      a proposal through its consequences.
  caveat:
    name: Caveat
    level: L6
    id: QF
    definition: >-
      A limitation or qualification the author acknowledges regarding their own argument 
      or conclusion.
    boundary: >-
      Must be the author's own concession limiting the scope, strength, certainty, or 
      applicability of a claim.
    guidance: >-
      Identify which claim is qualified and how. Do not classify opposing arguments or 
      alternative explanations as caveats without a distinct qualification.
  other_explanation:
    name: Other explanation
    level: L6
    group: R
    definition: >-
      An alternative causal explanation the author acknowledges but does not adopt as their 
      preferred account.
    boundary: >-
      Must identify a plausible rival cause, not merely an opposing claim or conflicting measurement.
    guidance: >-
      Use mechanism for causal explanations the author adopts. Use evidence_discrepancy for 
      conflicting measurements and opposing_view for disputed positions without a rival
      causal explanation.
  deferred_question:
    name: Deferred question
    level: L6
    id: DF
    definition: >-
      A question or issue the author explicitly postpones rather than resolving within 
      the current argument.
    boundary: >-
      Requires clear evidence of deliberate postponement, not merely uncertainty or an 
      unanswered question.
    guidance: >-
      Extract only when the author explicitly sets an issue aside or reserves it for future 
      consideration. Use question for the central problem motivating the article.

# A link reads "<from> <relation> <to>". sign is argumentative (+1 backs, -1 pushes back,
# 0 neither), never causal. `seen` lists the level pairs (from>to) this relation joins in
# the 472 hand-drawn links; a model link outside that list is flagged for a person, not
# rejected, because the maps themselves contain rare pairs (for example 6 L4>L3 supports).
relations:
  supports:
    sign: 1
    meaning: <from> gives a reason to accept <to>.
    seen: [L0>L0, L1>L2, L1>L3, L1>L4, L1>L5, L2>L2, L2>L3, L2>L4, L2>L5, L3>L3, L3>L4, L3>L5, L4>L3, L4>L4, L4>L5]
  licenses:
    sign: 1
    meaning: <from> is the rule behind the step to <to>; without it the step is invalid.
    seen: [L1>L3, L1>L4, L1>L5, L1B>L4, L3>L5]
  bounds:
    sign: 1
    meaning: <from> fixes how <to> is measured or what it is compared against.
    seen: [L1B>L1B, L1B>L2]
  motivates:
    sign: 1
    meaning: <from> is the reason <to> is raised or proposed.
    seen: [L0>L0, L5>L5]
  reconstructs:
    sign: 1
    meaning: <from> leads to <to>, a replacement for a quantity shown to be wrong.
    seen: [L5>L5]
  revises:
    sign: -1
    meaning: <from> is a belief the author admits was wrong; <to> is the assumption that admission bears on.
    seen: [L1>L1]
  rebuts:
    sign: -1
    meaning: <from> argues directly against <to>.
    seen: [L4>L6, L5>L6]
  qualified_by:
    sign: -1
    meaning: <to> limits where <from> holds; <to> is the caveat.
    seen: [L2>L6, L4>L6, L5>L6]
  undercut_by:
    sign: -1
    meaning: <to> weakens <from> without refuting it; <to> is the rival cause or offsetting force.
    seen: [L1>L2, L1>L3, L3>L6, L4>L6]
  defers:
    sign: 0
    meaning: <from> explicitly sets <to> aside for later.
    seen: [L5>L6]
  frames:
    sign: 0
    meaning: <from> sets up <to> without arguing for it - the question setting up a prior, or a prior setting up the evidence it makes relevant.
    seen: [L0>L1, L1>L2]

# Every hand-drawn box except a few questions takes part in at least one link (367 of 373).
# A model box left unlinked gets one targeted re-ask.
linked_exempt: [question]

# How finely an article is cut, from the annotator's hand-written reading pass of the worked
# example. The box-count range is measured from the hand-drawn maps at run time.
granularity:
  rules:
    - One box per move in the argument, written as one sentence in your own words.
    - Gather the figures that make one point into one evidence_data box; do not make one box per number.
    - Connective paragraphs and background illustrations of the premise get no box of their own; the premise belongs in the question.
    - Cite every paragraph a box draws on, not only the best one.
    - Read the figures and the references too - much of the evidence is in charts and cited work.
    - Do not add a box the article does not support. Leaving a role empty is a valid answer.
